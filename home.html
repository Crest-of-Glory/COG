<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - หน้าหลัก</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0f0f0f;
            --admin-color: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        /* ส่วนหัวโปรไฟล์ย่อ */
        .user-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            gap: 10px;
        }

        .user-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0; /* ป้องกันข้อความดัน layout แตก */
        }

        .avatar-box {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 50%;
            background-color: var(--border-color);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .user-details h2 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap; /* บังคับให้อยู่บรรทัดเดียวไม่ตัดคำ */
        }

        .logout-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ตารางแอป / ไอคอนหลัก */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: var(--text-primary);
            aspect-ratio: 1;
        }

        .app-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
            background-color: #222222;
        }

        .app-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .app-name {
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        /* ปุ่มพิเศษสำหรับแอดมิน */
        .admin-card {
            border-color: #552222;
            background-color: #1a0f0f;
        }
        .admin-card:hover {
            border-color: var(--admin-color);
        }
        .admin-card .app-name {
            color: var(--admin-color);
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-message {
            font-size: 15px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .popup-btn {
            padding: 8px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- ข้อมูลโปรไฟล์ย่อด้านบน -->
        <div class="user-header">
            <div class="user-info-left">
                <div class="avatar-box" id="user-avatar-container">
                    <span id="avatar-initial">?</span>
                </div>
                <div class="user-details">
                    <h2 id="user-display-name">กำลังโหลด...</h2>
                    <p id="user-level-text">เลเวล 1</p>
                    <p id="user-id-text">ID: --------</p>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">ออกจากระบบ</button>
        </div>

        <p class="section-title">เมนูหลัก (Apps)</p>

        <!-- ตารางไอคอนแอปต่างๆ -->
        <div class="app-grid">
            <a href="profile.html" class="app-card">
                <span class="app-icon">👤</span>
                <span class="app-name">Profile</span>
            </a>
            <a href="bank.html" class="app-card">
                <span class="app-icon">🏦</span>
                <span class="app-name">Bank</span>
            </a>
            <a href="guild.html" class="app-card">
                <span class="app-icon">🛡️</span>
                <span class="app-name">Guild</span>
            </a>
            <a href="friendship.html" class="app-card">
                <span class="app-icon">💬</span>
                <span class="app-name">Friendship</span>
            </a>
            <a href="store.html" class="app-card">
                <span class="app-icon">🛒</span>
                <span class="app-name">Store</span>
            </a>
            <a href="inventory.html" class="app-card">
                <span class="app-icon">🎒</span>
                <span class="app-name">Inventory</span>
            </a>
            <a href="kitchen.html" class="app-card">
                <span class="app-icon">🧪</span>
                <span class="app-name">Kitchen</span>
            </a>
            <a href="daily.html" class="app-card">
                <span class="app-icon">📅</span>
                <span class="app-name">Daily Code</span>
            </a>
            <a href="myquests.html" class="app-card">
                <span class="app-icon">📜</span>
                <span class="app-name">Mission</span>
            </a>
            <a href="leaderboard.html" class="app-card">
                <span class="app-icon">🏆</span>
                <span class="app-name">Leaderboard</span>
            </a>
            <a href="mini-game.html" class="app-card">
                <span class="app-icon">⚔️</span>
                <span class="app-name">Mini Game</span>
            </a>

            <!-- แอป Admin (จะซ่อนไว้จนกว่าจะเป็นแอดมิน) -->
            <a href="admin.html" class="app-card admin-card" id="admin-app-btn" style="display: none;">
                <span class="app-icon">⚡</span>
                <span class="app-name">Admin</span>
            </a>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text">ข้อความแจ้งเตือน</p>
            <button class="popup-btn" onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <!-- โหลด Supabase และควบคุมระบบผ่าน Module Script -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.showPopup = function(message, callback = null) {
            const modal = document.getElementById('popup-modal');
            const textEl = document.getElementById('popup-text');
            textEl.textContent = message;
            modal.style.display = 'flex';
            window.popupCallback = callback;
        };

        window.closePopup = function() {
            document.getElementById('popup-modal').style.display = 'none';
            if (window.popupCallback) {
                window.popupCallback();
                window.popupCallback = null;
            }
        };

        // ตรวจสอบ Session และดึงข้อมูลโปรไฟล์มาแสดง
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            
            if (!session || sessionError) {
                window.location.href = 'index.html';
                return;
            }

            const userId = session.user.id;
            const userEmail = session.user.email;

            // ดึงข้อมูลจากตาราง profiles
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', userId)
                .single();

            if (profileError || !profile) {
                window.showPopup('ไม่พบข้อมูลโปรไฟล์ผู้เล่น');
                return;
            }

            // แสดงชื่อ เลเวล และ ID แยกบรรทัดกันชัดเจน
            const displayName = profile.name || profile.username || 'ผู้เล่น';
            document.getElementById('user-display-name').textContent = displayName;
            document.getElementById('user-level-text').textContent = `เลเวล ${profile.level || 1}`;
            document.getElementById('user-id-text').textContent = `ID: ${profile.player_id || '--------'}`;

            // จัดการรูปโปรไฟล์ (Avatar)
            const avatarContainer = document.getElementById('user-avatar-container');
            if (profile.avatar_url) {
                avatarContainer.innerHTML = `<img src="${profile.avatar_url}" alt="Avatar">`;
            } else {
                document.getElementById('avatar-initial').textContent = displayName.charAt(0).toUpperCase();
            }

            // ตรวจสอบสิทธิ์ Admin
            if (profile.is_admin || userEmail === 'adminzelisanya@gmail.com') {
                document.getElementById('admin-app-btn').style.display = 'flex';
            }
        });

        // ฟังก์ชันออกจากระบบ
        window.handleLogout = async function() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
