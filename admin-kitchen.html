<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - จัดการห้องครัว (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--border-focus);
            background-color: #222222 !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        /* ส่วนผสม Dynamic */
        .ingredient-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .ingredient-row input {
            flex: 2;
        }

        .ingredient-row input.qty {
            flex: 1;
        }

        .small-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .small-btn:hover {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.05);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--text-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        /* รายการสูตรอาหารในระบบ */
        .recipe-row {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            gap: 12px;
        }

        .recipe-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #262626;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #555;
            flex-shrink: 0;
        }

        .recipe-info {
            flex: 1;
        }

        .recipe-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .recipe-details {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: none;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #e74c3c;
            color: #fff;
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="admin.html" class="back-btn">กลับหน้าแอดมิน</a>
            <h1 class="page-title">Admin Kitchen</h1>
        </div>

        <!-- ฟอร์มเพิ่มสูตรอาหาร/ยาใหม่ -->
        <div class="card">
            <p class="section-heading">เพิ่มสูตรอาหารหรือยา</p>
            <div class="form-group">
                <label>รูปภาพประกอบ</label>
                <input type="file" id="recipe-image-file" accept="image/*">
            </div>
            <div class="form-group">
                <label>ชื่อเมนู / ชื่อยา</label>
                <input type="text" id="recipe-name" placeholder="ระบุชื่อเมนู...">
            </div>
            <div class="form-group">
                <label>หมวดหมู่</label>
                <select id="recipe-category">
                    <option value="food">อาหาร (Food)</option>
                    <option value="potion">ยา (Potion)</option>
                </select>
            </div>
            
            <!-- ส่วนผสม -->
            <div class="form-group">
                <label>ส่วนผสมที่ต้องใช้</label>
                <div id="ingredients-container">
                    <div class="ingredient-row">
                        <input type="text" placeholder="ชื่อวัตถุดิบ (เช่น มะเขือเทศ)" class="ing-name">
                        <input type="number" placeholder="จำนวน" class="qty" min="1" value="1">
                        <button type="button" class="small-btn" onclick="removeIngredientRow(this)">ลบ</button>
                    </div>
                </div>
                <button type="button" class="small-btn" onclick="addIngredientRow()" style="margin-top: 8px; width: 100%; padding: 8px;">+ เพิ่มส่วนผสม</button>
            </div>

            <div class="form-group">
                <label>ราคาขาย (Gold)</label>
                <input type="number" id="recipe-sell-price" placeholder="ระบุราคาขาย..." min="0" step="0.01">
            </div>

            <div class="form-group">
                <label>ระยะเวลาในการทำ (เช่น 1 hour 30 minutes)</label>
                <input type="text" id="recipe-duration" placeholder="เช่น 30 minutes หรือ 1 hour">
            </div>

            <div class="form-group">
                <label>รายละเอียดสรรพคุณ (ฟื้นฟูสเตตัส)</label>
                <input type="text" id="recipe-effect" placeholder="เช่น ฟื้นฟูหลอดหิว 50 หน่วย">
            </div>

            <div class="form-group">
                <label>เลเวลผู้เล่นขั้นต่ำที่สามารถทำได้</label>
                <input type="number" id="recipe-min-level" placeholder="ระบุเลเวล เช่น 1" min="1" value="1">
            </div>

            <button type="button" class="action-btn" onclick="addNewRecipe()">บันทึกสูตรเมนู</button>
        </div>

        <!-- รายการสูตรอาหารปัจจุบัน -->
        <div class="card">
            <p class="section-heading">รายการสูตรอาหารและยาในระบบ</p>
            <div id="recipes-list">
                <div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ควบคุมระบบ Kitchen Admin -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CLOUDINARY_UPLOAD_PRESET = 'preset_name'; // ตั้งค่า Cloudinary Preset ของคุณ
        const CLOUDINARY_CLOUD_NAME = 'cloud_name';     // ตั้งค่า Cloudinary Cloud Name ของคุณ

        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // เช็คสิทธิ์แอดมิน
            const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
            if (!profile || !profile.is_admin) {
                window.location.href = 'home.html';
                return;
            }

            await loadRecipes();
        });

        window.addIngredientRow = function() {
            const container = document.getElementById('ingredients-container');
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.innerHTML = `
                <input type="text" placeholder="ชื่อวัตถุดิบ" class="ing-name">
                <input type="number" placeholder="จำนวน" class="qty" min="1" value="1">
                <button type="button" class="small-btn" onclick="removeIngredientRow(this)">ลบ</button>
            `;
            container.appendChild(row);
        };

        window.removeIngredientRow = function(btn) {
            const rows = document.querySelectorAll('.ingredient-row');
            if (rows.length > 1) {
                btn.parentElement.remove();
            } else {
                showPopup('ต้องมีส่วนผสมอย่างน้อย 1 อย่าง');
            }
        };

        async function loadRecipes() {
            const container = document.getElementById('recipes-list');
            const { data: recipes, error } = await supabase.from('kitchen_recipes').select('*').order('name');

            if (error || !recipes || recipes.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">ยังไม่มีสูตรอาหารหรือยาในระบบ</div>';
                return;
            }

            container.innerHTML = '';
            recipes.forEach(r => {
                const row = document.createElement('div');
                row.className = 'recipe-row';

                const thumbHtml = r.image_url 
                    ? `<img src="${r.image_url}" class="recipe-thumb">` 
                    : `<div class="recipe-thumb">🍲</div>`;

                row.innerHTML = `
                    ${thumbHtml}
                    <div class="recipe-info">
                        <div class="recipe-name">${r.name} (${r.category === 'food' ? 'อาหาร' : 'ยา'})</div>
                        <div class="recipe-details">ราคาขาย: ${r.sell_price} Gold | เลเวลขั้นต่ำ: ${r.required_level}</div>
                    </div>
                    <button type="button" class="delete-btn" onclick="deleteRecipe('${r.id}')">ลบ</button>
                `;
                container.appendChild(row);
            });
        }

        window.addNewRecipe = async function() {
            const name = document.getElementById('recipe-name').value.trim();
            const category = document.getElementById('recipe-category').value;
            const sellPrice = Number(document.getElementById('recipe-sell-price').value);
            const duration = document.getElementById('recipe-duration').value.trim();
            const effect = document.getElementById('recipe-effect').value.trim();
            const minLevel = Number(document.getElementById('recipe-min-level').value) || 1;
            const fileInput = document.getElementById('recipe-image-file');

            if (!name || isNaN(sellPrice) || sellPrice < 0 || !duration) {
                showPopup('กรุณากรอกข้อมูลสำคัญให้ครบถ้วนและถูกต้อง');
                return;
            }

            // รวบรวมส่วนผสมจากฟอร์ม
            const ingredients = [];
            const rows = document.querySelectorAll('.ingredient-row');
            rows.forEach(row => {
                const ingName = row.querySelector('.ing-name').value.trim();
                const qty = Number(row.querySelector('.qty').value) || 1;
                if (ingName) {
                    ingredients.push({ name: ingName, qty: qty });
                }
            });

            if (ingredients.length === 0) {
                showPopup('กรุณาระบุส่วนผสมอย่างน้อย 1 รายการ');
                return;
            }

            let imageUrl = '';
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.secure_url) {
                        imageUrl = data.secure_url;
                    }
                } catch (err) {
                    console.error('Cloudinary upload error:', err);
                }
            }

            const { error } = await supabase.from('kitchen_recipes').insert({
                name: name,
                category: category,
                ingredients: ingredients,
                sell_price: sellPrice,
                craft_duration: duration,
                effect_description: effect,
                required_level: minLevel,
                image_url: imageUrl
            });

            if (error) {
                showPopup('เกิดข้อผิดพลาดในการบันทึกสูตร (ชื่อเมนูอาจซ้ำในระบบ)');
                return;
            }

            showPopup('บันทึกสูตรอาหาร/ยาสำเร็จ!', () => {
                location.reload();
            });
        };

        window.deleteRecipe = async function(recipeId) {
            const { error } = await supabase.from('kitchen_recipes').delete().eq('id', recipeId);
            if (error) {
                showPopup('ไม่สามารถลบสูตรอาหารนี้ได้');
                return;
            }
            showPopup('ลบสูตรอาหารเรียบร้อยแล้ว', () => {
                location.reload();
            });
        };
    </script>
</body>
</html>
