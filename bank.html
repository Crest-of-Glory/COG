<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ธนาคารส่วนตัว</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-display {
            text-align: center;
            padding: 15px 0;
        }

        .balance-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .balance-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
        }

        .form-group input[readonly] {
            color: var(--text-secondary);
            border-style: dashed;
            cursor: not-allowed;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .contact-list {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .contact-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .contact-item:hover {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.05);
        }

        .contact-info strong {
            display: block;
            font-size: 13px;
        }

        .contact-info span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .delete-contact {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* ป๊อปอัพและสลิป */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-message {
            font-size: 14px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Bank</h1>
            <div style="width: 75px;"></div>
        </div>

        <!-- ข้อมูลบัญชีและยอดเงิน -->
        <div class="card">
            <div class="balance-display">
                <p class="balance-label">ยอดเงินในบัญชี</p>
                <h2 class="balance-value" id="account-balance">0 Gold</h2>
            </div>
            <form id="account-form">
                <div class="form-group">
                    <label for="account-name">ชื่อบัญชี</label>
                    <input type="text" id="account-name" required>
                </div>
                <div class="form-group">
                    <label>เลขบัญชี (10 หลัก)</label>
                    <input type="text" id="account-number" readonly>
                </div>
                <button type="submit" class="action-btn">บันทึกชื่อบัญชี</button>
            </form>
        </div>

        <!-- ฟังก์ชันโอนเงิน (Transfer) -->
        <div class="card">
            <p class="section-heading">โอนเงิน (Transfer)</p>
            <form id="transfer-form">
                <div class="form-group">
                    <label for="receiver-account">เลขบัญชีผู้รับ (10 หลัก)</label>
                    <input type="text" id="receiver-account" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="transfer-amount">จำนวนเงิน (Gold)</label>
                    <input type="number" step="0.01" min="0.01" id="transfer-amount" required>
                </div>
                <div class="form-group">
                    <label for="transfer-note">หมายเหตุ (ถ้ามี)</label>
                    <input type="text" id="transfer-note">
                </div>
                <button type="submit" class="action-btn">ยืนยันการโอนเงิน</button>
            </form>
        </div>

        <!-- ฟังก์ชันรายชื่อ (Contacts) -->
        <div class="card" style="margin-bottom: 0;">
            <p class="section-heading">รายชื่อผู้ติดต่อ (Contacts)</p>
            <div class="contact-list" id="contact-list-container">
                <!-- รายชื่อจะถูกเรนเดอร์ตรงนี้ -->
            </div>
            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">ชื่อผู้รับ (ที่จำง่าย)</label>
                    <input type="text" id="contact-name" required>
                </div>
                <div class="form-group">
                    <label for="contact-number">เลขบัญชีผู้รับ (10 หลัก)</label>
                    <input type="text" id="contact-number" maxlength="10" required>
                </div>
                <button type="submit" class="action-btn">เพิ่มรายชื่อ</button>
            </form>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน / สลิป -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ทำงานหน้า Bank -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentBank = null;
        let currentProfile = null;
        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        // จัดการรูปแบบแสดงผลเงิน: 100 Silver = 1 Gold. ถ้าจำนวนเต็ม Gold ไม่ต้องใส่ .00
        function formatGold(goldVal, silverVal) {
            const totalGold = Number(goldVal || 0) + (Number(silverVal || 0) / 100);
            if (totalGold === 0) return '0 Gold';
            if (totalGold % 1 === 0) {
                return `${totalGold} Gold`;
            } else {
                return `${totalGold.toFixed(2)} Gold`;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            await loadBankData();
            await loadContacts();

            // บันทึกชื่อบัญชี
            document.getElementById('account-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newName = document.getElementById('account-name').value.trim();

                const { error: updateErr } = await supabase
                    .from('bank_accounts')
                    .update({ account_name: newName })
                    .eq('id', currentUser.id);

                if (updateErr) {
                    showPopup('บันทึกชื่อบัญชีไม่สำเร็จ: ' + updateErr.message);
                } else {
                    showPopup('บันทึกชื่อบัญชีเรียบร้อยแล้ว');
                }
            });

            // โอนเงิน
            document.getElementById('transfer-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const receiverAcc = document.getElementById('receiver-account').value.trim();
                const amount = parseFloat(document.getElementById('transfer-amount').value);
                const note = document.getElementById('transfer-note').value.trim();

                if (receiverAcc === currentBank.account_number) {
                    showPopup('ไม่สามารถโอนเงินเข้าบัญชีตัวเองได้');
                    return;
                }

                const totalUserGold = Number(currentBank.gold || 0) + (Number(currentBank.silver || 0) / 100);
                if (totalUserGold < amount) {
                    showPopup(`ยอดเงินในบัญชีไม่พอ! คุณมี ${formatGold(currentBank.gold, currentBank.silver)}`);
                    return;
                }

                // ค้นหาบัญชีผู้รับ
                const { data: receiverBank, error: recErr } = await supabase
                    .from('bank_accounts')
                    .select('*')
                    .eq('account_number', receiverAcc)
                    .maybeSingle();

                if (recErr || !receiverBank) {
                    showPopup('ไม่พบเลขบัญชีปลายทางนี้ในระบบ');
                    return;
                }

                // ดึงชื่อโปรไฟล์ผู้รับและผู้ส่งสำหรับทำสลิป
                const { data: receiverProf } = await supabase.from('profiles').select('name').eq('id', receiverBank.id).maybeSingle();
                const { data: senderProf } = await supabase.from('profiles').select('name').eq('id', currentUser.id).maybeSingle();

                const receiverName = receiverProf?.name || receiverBank.account_name || 'ไม่ระบุชื่อ';
                const senderName = senderProf?.name || currentBank.account_name || 'ไม่ระบุชื่อ';

                // คำนวณยอดเงินใหม่ (หักฝั่งผู้โอน เพิ่มฝั่งผู้รับ)
                const newSenderTotal = totalUserGold - amount;
                const receiverTotal = Number(receiverBank.gold || 0) + (Number(receiverBank.silver || 0) / 100) + amount;

                // อัปเดตธนาคารผู้โอน
                const { error: sendUpdateErr } = await supabase
                    .from('bank_accounts')
                    .update({ gold: newSenderTotal, silver: 0 })
                    .eq('id', currentUser.id);

                if (sendUpdateErr) {
                    showPopup('การโอนเงินล้มเหลว');
                    return;
                }

                // อัปเดตธนาคารผู้รับ
                await supabase
                    .from('bank_accounts')
                    .update({ gold: receiverTotal, silver: 0 })
                    .eq('id', receiverBank.id);

                // บันทึกประวัติ Transaction / สลิป
                const now = new Date();
                const dateTimeStr = now.toISOString().replace('T', ' ').substring(0, 19);

                await supabase.from('transactions').insert({
                    sender_id: currentUser.id,
                    sender_name: senderName,
                    sender_account: currentBank.account_number,
                    receiver_id: receiverBank.id,
                    receiver_name: receiverName,
                    receiver_account: receiverAcc,
                    amount: amount,
                    currency: 'Gold',
                    note: note
                });

                await loadBankData();
                document.getElementById('transfer-form').reset();

                // แสดงสลิปโอนเงินสุดเท่
                const slipText = `===== 🧾 สลิปโอนเงิน (TRANSACTION SLIP) =====
📅 วันที่/เวลา: ${dateTimeStr} (UTC)
--------------------------------------------------
📤 ผู้โอน: ${senderName}
💳 เลขบัญชีผู้โอน: ${currentBank.account_number}
--------------------------------------------------
📥 ผู้รับ: ${receiverName}
💳 เลขบัญชีผู้รับ: ${receiverAcc}
--------------------------------------------------
💰 จำนวนเงิน: ${amount} Gold
📝 หมายเหตุ: ${note || '-'}
==================================================`;

                showPopup(`โอนเงินสำเร็จ!\n\n` + slipText);
            });

            // เพิ่มรายชื่อ
            document.getElementById('contact-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const cName = document.getElementById('contact-name').value.trim();
                const cNum = document.getElementById('contact-number').value.trim();

                const { error: insErr } = await supabase.from('bank_contacts').insert({
                    user_id: currentUser.id,
                    contact_name: cName,
                    contact_account_number: cNum
                });

                if (insErr) {
                    showPopup('เพิ่มรายชื่อไม่สำเร็จ: ' + insErr.message);
                } else {
                    showPopup('เพิ่มรายชื่อผู้ติดต่อเรียบร้อยแล้ว');
                    document.getElementById('contact-form').reset();
                    await loadContacts();
                }
            });
        });

        async function loadBankData() {
            const { data: bank, error } = await supabase
                .from('bank_accounts')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();

            if (error || !bank) {
                showPopup('ไม่พบข้อมูลบัญชีธนาคาร');
                return;
            }

            currentBank = bank;
            document.getElementById('account-name').value = bank.account_name || '';
            document.getElementById('account-number').value = bank.account_number || '';
            document.getElementById('account-balance').textContent = formatGold(bank.gold, bank.silver);
        }

        async function loadContacts() {
            const { data: contacts, error } = await supabase
                .from('bank_contacts')
                .select('*')
                .eq('user_id', currentUser.id);

            const container = document.getElementById('contact-list-container');
            container.innerHTML = '';

            if (error || !contacts || contacts.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:10px;">ยังไม่มีรายชื่อผู้ติดต่อ</p>';
                return;
            }

            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.innerHTML = `
                    <div class="contact-info" onclick="selectContact('${c.contact_account_number}')">
                        <strong>${c.contact_name}</strong>
                        <span>เลขบัญชี: ${c.contact_account_number} (คลิกเพื่อโอน)</span>
                    </div>
                    <button type="button" class="delete-contact" onclick="deleteContact(event, '${c.id}')">ลบ</button>
                `;
                container.appendChild(item);
            });
        }

        // ฟังก์ชันเลือกรายชื่อมากรอกช่องโอนเงินอัตโนมัติ
        window.selectContact = function(accNum) {
            document.getElementById('receiver-account').value = accNum;
            window.scrollTo({ top: document.getElementById('transfer-form').offsetTop - 50, behavior: 'smooth' });
        };

        // ฟังก์ชันลบรายชื่อ
        window.deleteContact = async function(event, contactId) {
            event.stopPropagation();
            const { error } = await supabase.from('bank_contacts').delete().eq('id', contactId);
            if (!error) {
                await loadContacts();
            }
        };
    </script>
</body>
</html>
