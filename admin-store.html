<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - จัดการร้านค้า (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--border-focus);
            background-color: #222222 !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--text-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        /* รายการสินค้าในระบบ */
        .item-row {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            gap: 12px;
        }

        .item-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #262626;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #555;
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .item-price {
            font-size: 11px;
            color: #f39c12;
        }

        .delete-btn {
            background: none;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #e74c3c;
            color: #fff;
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="admin.html" class="back-btn">กลับหน้าแอดมิน</a>
            <h1 class="page-title">Admin Store</h1>
        </div>

        <!-- ฟอร์มเพิ่มสินค้าใหม่ -->
        <div class="card">
            <p class="section-heading">เพิ่มไอเท็มลงร้านค้า</p>
            <div class="form-group">
                <label>ลิงก์รูปภาพจาก Cloudinary (URL)</label>
                <input type="url" id="item-image-url" placeholder="https://res.cloudinary.com/...">
            </div>
            <div class="form-group">
                <label>ชื่อสินค้า</label>
                <input type="text" id="item-name" placeholder="ระบุชื่อสินค้า...">
            </div>
            <div class="form-group">
                <label>ราคา</label>
                <input type="number" id="item-price" placeholder="ระบุราคา..." min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>สกุลเงิน</label>
                <select id="item-currency">
                    <option value="Gold">Gold</option>
                    <option value="Silver">Silver</option>
                </select>
            </div>
            <div class="form-group">
                <label>รายละเอียดสินค้า</label>
                <textarea id="item-desc" rows="3" placeholder="ระบุคำอธิบายสินค้า..."></textarea>
            </div>
            <button type="button" class="action-btn" onclick="addNewStoreItem()">วางขายสินค้า</button>
        </div>

        <!-- รายการสินค้าที่มีในร้านค้า -->
        <div class="card">
            <p class="section-heading">รายการสินค้าในร้านค้าปัจจุบัน</p>
            <div id="store-items-list">
                <div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ควบคุมการจัดการ Store ของแอดมิน -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // เช็คสิทธิ์แอดมิน
            const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
            if (!profile || !profile.is_admin) {
                window.location.href = 'home.html';
                return;
            }

            await loadStoreItems();
        });

        async function loadStoreItems() {
            const container = document.getElementById('store-items-list');
            const { data: items, error } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });

            if (error || !items || items.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">ยังไม่มีสินค้าในร้านค้า</div>';
                return;
            }

            container.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';

                const thumbHtml = item.image_url 
                    ? `<img src="${item.image_url}" class="item-thumb">` 
                    : `<div class="item-thumb">📦</div>`;

                row.innerHTML = `
                    ${thumbHtml}
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">ราคา: ${item.price} ${item.currency}</div>
                    </div>
                    <button type="button" class="delete-btn" onclick="deleteStoreItem('${item.id}')">ลบ</button>
                `;
                container.appendChild(row);
            });
        }

        window.addNewStoreItem = async function() {
            const name = document.getElementById('item-name').value.trim();
            const price = Number(document.getElementById('item-price').value);
            const currency = document.getElementById('item-currency').value;
            const description = document.getElementById('item-desc').value.trim();
            const imageUrl = document.getElementById('item-image-url').value.trim();

            if (!name || isNaN(price) || price < 0) {
                showPopup('กรุณากรอกชื่อสินค้าและราคาให้ถูกต้อง');
                return;
            }

            const { error } = await supabase.from('store_items').insert({
                name: name,
                price: price,
                currency: currency,
                description: description,
                image_url: imageUrl
            });

            if (error) {
                showPopup('เกิดข้อผิดพลาดในการเพิ่มสินค้า (ชื่อสินค้าอาจซ้ำกันในระบบ)');
                return;
            }

            showPopup('วางขายสินค้าสำเร็จ!', () => {
                location.reload();
            });
        };

        window.deleteStoreItem = async function(itemId) {
            const { error } = await supabase.from('store_items').delete().eq('id', itemId);
            if (error) {
                showPopup('ไม่สามารถลบสินค้าได้');
                return;
            }
            showPopup('ลบสินค้าออกจากร้านค้าเรียบร้อยแล้ว', () => {
                location.reload();
            });
        };
    </script>
</body>
</html>
