<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ภาพรวมกิลด์ (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--border-focus);
            background-color: #222222 !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        /* การ์ดแสดงข้อมูลกิลด์ */
        .guild-card {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .guild-card:hover {
            border-color: var(--border-focus);
        }

        .guild-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background-color: #262626;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #555;
            flex-shrink: 0;
        }

        .guild-info {
            flex: 1;
        }

        .guild-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .guild-details {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* ป๊อปอัพรายละเอียดกิลด์ */
        #popup-modal, #guild-detail-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .member-list-box {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            text-align: left;
        }

        .member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
        }

        .member-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="admin.html" class="back-btn">กลับหน้าแอดมิน</a>
            <h1 class="page-title">Admin Guild Overview</h1>
        </div>

        <!-- ช่องค้นหากิลด์ -->
        <div class="card" style="padding: 15px; margin-bottom: 12px;">
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="search-guild-input" placeholder="ค้นหาด้วยชื่อกิลด์ หรือ ID 6 หลัก..." oninput="filterGuilds()">
            </div>
        </div>

        <!-- รายการกิลด์ทั้งหมดในระบบ -->
        <div class="card">
            <p class="section-heading">รายชื่อกิลด์ทั้งหมดในระบบ</p>
            <div id="guilds-list-container">
                <div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">กำลังโหลดข้อมูลกิลด์...</div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพรายละเอียดกิลด์ -->
    <div id="guild-detail-modal">
        <div class="popup-content">
            <p class="section-heading" id="modal-guild-name" style="margin-bottom: 10px; text-align: center;">รายละเอียดกิลด์</p>
            <div class="popup-message" id="modal-guild-info" style="margin-bottom: 15px;"></div>
            <p class="section-heading" style="font-size: 11px; margin-bottom: 6px; text-align: left;">รายชื่อสมาชิกในกิลด์</p>
            <div class="member-list-box" id="modal-member-list"></div>
            <button class="popup-btn" onclick="document.getElementById('guild-detail-modal').style.display='none'">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือนทั่วไป -->
    <div id="popup-modal">
        <div class="popup-content" style="max-height: none;">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ควบคุมหน้า Admin Guild Overview -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allGuilds = [];
        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // เช็คสิทธิ์แอดมิน
            const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();
            if (!profile || !profile.is_admin) {
                window.location.href = 'home.html';
                return;
            }

            await loadAllGuilds();
        });

        async function loadAllGuilds() {
            const container = document.getElementById('guilds-list-container');
            
            // ดึงข้อมูลกิลด์ทั้งหมด
            const { data: guilds, error } = await supabase.from('guilds').select('*').order('level', { ascending: false });

            if (error || !guilds || guilds.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 20px;">ยังไม่มีกิลด์ในระบบ</div>';
                return;
            }

            allGuilds = guilds;
            renderGuildsList(allGuilds);
        }

        async function renderGuildsList(guilds) {
            const container = document.getElementById('guilds-list-container');
            container.innerHTML = '';

            for (const g of guilds) {
                // นับจำนวนสมาชิกปัจจุบันในกิลด์
                const { count: memberCount } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('guild_id', g.id);

                const card = document.createElement('div');
                card.className = 'guild-card';
                card.onclick = () => openGuildDetail(g, memberCount || 0);

                const thumbHtml = g.avatar_url 
                    ? `<img src="${g.avatar_url}" class="guild-thumb">` 
                    : `<div class="guild-thumb">🛡️</div>`;

                card.innerHTML = `
                    ${thumbHtml}
                    <div class="guild-info">
                        <div class="guild-name">${g.name} (ID: ${g.guild_id_code})</div>
                        <div class="guild-details">
                            เลเวล: ${g.level} | สมาชิก: ${memberCount || 0}/${g.max_members || 15}<br>
                            ภารกิจสะสม: ${g.total_missions || 0} | กองทุน: ${g.guild_fund || 0} Gold
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        window.filterGuilds = function() {
            const keyword = document.getElementById('search-guild-input').value.trim().toLowerCase();
            if (!keyword) {
                renderGuildsList(allGuilds);
                return;
            }

            const filtered = allGuilds.filter(g => 
                g.name.toLowerCase().includes(keyword) || g.guild_id_code.toLowerCase().includes(keyword)
            );
            renderGuildsList(filtered);
        };

        async function openGuildDetail(guild, memberCount) {
            document.getElementById('modal-guild-name').textContent = `${guild.name} (ID: ${guild.guild_id_code})`;
            
            const infoText = `เลเวลกิลด์: ${guild.level} (EXP: ${guild.exp})\nจำนวนสมาชิก: ${memberCount} / ${guild.max_members}\nภารกิจสะสมรวม: ${guild.total_missions}\nเงินกองทุนกิลด์: ${guild.guild_fund} Gold`;
            document.getElementById('modal-guild-info').textContent = infoText;

            // ดึงรายชื่อสมาชิกในกิลด์
            const memberContainer = document.getElementById('modal-member-list');
            memberContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:11px; padding:10px;">กำลังโหลดสมาชิก...</div>';
            
            document.getElementById('guild-detail-modal').style.display = 'flex';

            const { data: members } = await supabase.from('profiles').select('name, username, guild_role, level').eq('guild_id', guild.id);

            if (!members || members.length === 0) {
                memberContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:11px; padding:10px;">ไม่มีสมาชิกในกิลด์</div>';
                return;
            }

            memberContainer.innerHTML = '';
            members.forEach(m => {
                let roleLabel = 'สมาชิก';
                if (m.guild_role === 'owner') roleLabel = 'หัวหน้ากิลด์';
                else if (m.guild_role === 'co-owner') roleLabel = 'รองหัวหน้า';
                else if (m.guild_role === 'assistant') roleLabel = 'ผู้ช่วย';

                const row = document.createElement('div');
                row.className = 'member-row';
                row.innerHTML = `
                    <span><strong>${m.name}</strong> (@${m.username}) [Lv.${m.level}]</span>
                    <span style="color:var(--text-secondary);">${roleLabel}</span>
                `;
                memberContainer.appendChild(row);
            });
        }
    </script>
</body>
</html>
