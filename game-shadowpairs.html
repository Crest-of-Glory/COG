<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - Shadow Pairs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; padding-bottom: 40px; }
        .header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: none; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .back-btn:hover { border-color: var(--border-focus); }
        .page-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .section-heading { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        
        .players-container { display: flex; gap: 10px; margin-bottom: 16px; }
        .player-box { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 40px; height: 40px; border-radius: 50%; background: #262626; object-fit: cover; border: 1px solid var(--border-color); }
        .player-info { display: flex; flex-direction: column; overflow: hidden; }
        .player-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-score { font-size: 11px; color: #4cd137; font-weight: bold; margin-top: 2px; }

        .status-box { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 15px; padding: 12px 14px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; align-items: center; }
        
        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .memory-card { aspect-ratio: 1; background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; user-select: none; transition: transform 0.2s, background 0.2s; }
        .memory-card:hover { border-color: var(--border-focus); background: #222; }
        .memory-card.flipped { background: #262626; border-color: #fff; }
        .memory-card.matched { background: rgba(76, 209, 55, 0.1); border-color: #4cd137; cursor: default; opacity: 0.6; }

        .action-btn { width: 100%; padding: 12px; background: var(--accent-color); color: var(--btn-text); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .action-btn:disabled { background: #262626; color: #666; cursor: not-allowed; }

        #popup-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1300; padding: 20px; }
        .popup-content { background: #141414; border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; text-align: center; max-width: 360px; width: 100%; }
        .popup-message { font-size: 13px; margin-bottom: 20px; color: var(--text-primary); line-height: 1.6; white-space: pre-line; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: left; }
        .popup-btn { padding: 10px 24px; background: var(--accent-color); color: var(--btn-text); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
        .popup-btn-group { display: flex; gap: 10px; }
        .popup-btn-cancel { background: #262626; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <button type="button" class="back-btn" onclick="confirmLeaveRoom()">ออกห้องเกม</button>
            <h1 class="page-title">Shadow Pairs</h1>
            <span id="room-badge" style="font-size: 11px; color: var(--text-secondary); font-weight: bold;">ห้อง: ----</span>
        </div>

        <div class="players-container">
            <div class="player-box">
                <img src="https://api.iconify.design/solar:user-circle-bold.svg?color=%23888888" class="player-avatar" id="p1-avatar">
                <div class="player-info">
                    <span class="player-name" id="p1-name">รอ Host...</span>
                    <span class="player-score" id="p1-score">คู่ที่จับได้: 0</span>
                </div>
            </div>
            <div class="player-box" id="p2-box" style="opacity: 0.4;">
                <img src="https://api.iconify.design/solar:user-circle-bold.svg?color=%23888888" class="player-avatar" id="p2-avatar">
                <div class="player-info">
                    <span class="player-name" id="p2-name">รอผู้เล่น...</span>
                    <span class="player-score" id="p2-score">คู่ที่จับได้: 0</span>
                </div>
            </div>
        </div>

        <div class="status-box">
            <span id="bet-pool-text">💰 เงินกองกลางเดิมพัน: 0 Gold</span>
            <span id="turn-status-text" style="font-weight: 600; color: #aaa;">รอผู้เล่น...</span>
        </div>

        <div class="card">
            <p class="section-heading">กระดานการ์ด (สัตว์ & ของกิน)</p>
            <div class="memory-grid" id="memory-grid"></div>
        </div>

        <div class="card" style="text-align: center;">
            <button type="button" class="action-btn" id="start-btn" onclick="startCardGame()" disabled>รอผู้เล่นครบเพื่อเริ่มเกม</button>
        </div>
    </div>

    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <div id="popup-actions">
                <button class="popup-btn" id="popup-close-btn">ตกลง</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room') || '0000';
        const gameMode = urlParams.get('mode') || 'create';
        const betAmount = Number(urlParams.get('bet') || 10);

        let roomData = null;
        let roomSubscription = null;
        let syncInterval = null;
        let isLeaving = false;
        let hasFinishedGame = false;
        const defaultAvatar = 'https://api.iconify.design/solar:user-circle-bold.svg?color=%23888888';

        const symbols = ['🐶', '🐱', '🐼', '🦁', '🍎', '🍕', '🍔', '🍰'];
        let flippedCards = [];

        function showPopup(msg, cb = null, showCancel = false) {
            document.getElementById('popup-text').textContent = msg;
            document.getElementById('popup-modal').style.display = 'flex';
            
            const actionsContainer = document.getElementById('popup-actions');
            if (showCancel) {
                actionsContainer.innerHTML = `
                    <div class="popup-btn-group">
                        <button class="popup-btn popup-btn-cancel" id="popup-cancel-btn">ยกเลิก</button>
                        <button class="popup-btn" id="popup-ok-btn">ยืนยันออก</button>
                    </div>
                `;
                document.getElementById('popup-cancel-btn').onclick = () => { document.getElementById('popup-modal').style.display = 'none'; };
                document.getElementById('popup-ok-btn').onclick = () => { document.getElementById('popup-modal').style.display = 'none'; if (cb) cb(); };
            } else {
                actionsContainer.innerHTML = `<button class="popup-btn" id="popup-close-btn">ตกลง</button>`;
                document.getElementById('popup-close-btn').onclick = () => { document.getElementById('popup-modal').style.display = 'none'; if (cb) cb(); };
            }
        }

        window.addEventListener('beforeunload', () => {
            if (!hasFinishedGame && !isLeaving && currentUser) {
                applyLeavePenaltyQuiet();
            }
        });

        async function applyLeavePenaltyQuiet() {
            try {
                const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
                if (bank) {
                    await supabase.from('bank_accounts').update({ gold: Math.max(0, Number(bank.gold) - 5) }).eq('id', currentUser.id);
                }
                if (roomData && roomData.host_id === currentUser.id) {
                    await supabase.from('game_rooms').delete().eq('room_code', roomCode);
                }
            } catch (e) {}
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('room-badge').textContent = `ห้อง: ${roomCode}`;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const { data: prof } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            userProfile = prof || { name: 'ผู้เล่น', avatar_url: '' };

            if (gameMode === 'create') {
                const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
                if (!bank || Number(bank.gold) < betAmount) {
                    showPopup('❌ เงินในธนาคารของคุณไม่พอสำหรับเดิมพันนี้', () => { window.location.href = 'mini-game.html'; });
                    return;
                }

                await supabase.from('bank_accounts').update({ gold: Number(bank.gold) - betAmount }).eq('id', currentUser.id);

                let cardDeck = [...symbols, ...symbols].sort(() => 0.5 - Math.random());

                const { data, error } = await supabase.from('game_rooms').upsert({
                    room_code: roomCode,
                    host_id: currentUser.id,
                    status: 'waiting',
                    bet_pool: betAmount,
                    card_deck: cardDeck,
                    matched_indices: [],
                    current_turn: currentUser.id,
                    p1_score: 0,
                    p2_score: 0,
                    history: []
                }).select().single();

                if (error) {
                    showPopup('❌ ไม่สามารถสร้างห้องได้ กรุณาลองใหม่อีกครั้ง', () => { window.location.href = 'mini-game.html'; });
                    return;
                }
                roomData = data;
            } else {
                const { data } = await supabase.from('game_rooms').select('*').eq('room_code', roomCode).single();
                if (!data) {
                    showPopup('❌ ไม่พบห้องนี้ในระบบหรือโฮสต์ออกจากห้องแล้ว', () => { window.location.href = 'mini-game.html'; });
                    return;
                }
                if (data.host_id === currentUser.id) {
                    showPopup('❌ คุณเป็นโฮสต์ของห้องนี้ ไม่สามารถเข้าร่วมเป็นผู้เล่นคนที่ 2 ได้', () => { window.location.href = 'mini-game.html'; });
                    return;
                }

                const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
                if (!bank || Number(bank.gold) < data.bet_pool) {
                    showPopup('❌ เงินในธนาคารของคุณไม่พอร่วมเดิมพันห้องนี้', () => { window.location.href = 'mini-game.html'; });
                    return;
                }

                await supabase.from('bank_accounts').update({ gold: Number(bank.gold) - data.bet_pool }).eq('id', currentUser.id);

                roomData = data;
                const newPool = Number(roomData.bet_pool) + Number(roomData.bet_pool);

                if (!roomData.guest_id || roomData.guest_id !== currentUser.id) {
                    await supabase.from('game_rooms').update({
                        guest_id: currentUser.id,
                        status: 'playing',
                        bet_pool: newPool
                    }).eq('room_code', roomCode);
                    roomData.guest_id = currentUser.id;
                    roomData.status = 'playing';
                    roomData.bet_pool = newPool;
                }
            }

            await fetchRoomDataAndRender();
            setupRealtimeSubscription();

            syncInterval = setInterval(async () => { await fetchRoomDataAndRender(); }, 2500);
        });

        function setupRealtimeSubscription() {
            roomSubscription = supabase.channel(`room_${roomCode}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'game_rooms', filter: `room_code=eq.${roomCode}` }, (payload) => {
                    if (payload.eventType === 'DELETE') {
                        if (syncInterval) clearInterval(syncInterval);
                        if (!isLeaving && !hasFinishedGame && roomData?.host_id !== currentUser?.id) {
                            isLeaving = true;
                            showPopup('❌ โฮสต์ออกจากห้องแล้ว ห้องถูกปิดทันที', () => { window.location.href = 'mini-game.html'; });
                        }
                        return;
                    }
                    roomData = payload.new;
                    renderBoard();
                    updateRoomUI();
                })
                .subscribe();
        }

        async function fetchRoomDataAndRender() {
            if (isLeaving) return;
            const { data, error } = await supabase.from('game_rooms').select('*').eq('room_code', roomCode).single();
            
            if (error || !data) {
                if (gameMode === 'create' && roomData && roomData.host_id === currentUser.id) {
                    return;
                }
                if (syncInterval) clearInterval(syncInterval);
                if (!isLeaving && !hasFinishedGame) {
                    isLeaving = true;
                    showPopup('❌ โฮสต์ออกจากห้องแล้ว ห้องถูกปิดทันที', () => { window.location.href = 'mini-game.html'; });
                }
                return;
            }
            roomData = data;
            renderBoard();
            updateRoomUI();
        }

        function updateRoomUI() {
            if (!roomData) return;
            document.getElementById('bet-pool-text').textContent = `💰 เงินกองกลางเดิมพัน: ${roomData.bet_pool} Gold`;

            if (roomData.host_id) {
                supabase.from('profiles').select('name, avatar_url').eq('id', roomData.host_id).single().then(({data}) => {
                    if (data) { document.getElementById('p1-name').textContent = data.name; document.getElementById('p1-avatar').src = data.avatar_url || defaultAvatar; }
                });
            }
            if (roomData.guest_id) {
                document.getElementById('p2-box').style.opacity = '1';
                supabase.from('profiles').select('name, avatar_url').eq('id', roomData.guest_id).single().then(({data}) => {
                    if (data) { document.getElementById('p2-name').textContent = data.name; document.getElementById('p2-avatar').src = data.avatar_url || defaultAvatar; }
                });
                const startBtn = document.getElementById('start-btn');
                if (roomData.status === 'playing') {
                    startBtn.disabled = false;
                    startBtn.textContent = 'เริ่มเกมจับคู่การ์ด!';
                }
            }

            document.getElementById('p1-score').textContent = `คู่ที่จับได้: ${roomData.p1_score || 0}`;
            document.getElementById('p2-score').textContent = `คู่ที่จับได้: ${roomData.p2_score || 0}`;

            const isMyTurn = (roomData.current_turn === currentUser.id);
            if (roomData.status === 'playing') {
                document.getElementById('turn-status-text').textContent = isMyTurn ? '✨ ตาของคุณเปิดการ์ด!' : '⏳ รอคู่ต่อสู้เปิดการ์ด...';
            }
        }

        function renderBoard() {
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = '';
            if (!roomData || !roomData.card_deck) return;

            const deckArr = roomData.card_deck;
            const matched = roomData.matched_indices || [];

            deckArr.forEach((symbol, idx) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'memory-card';
                if (matched.includes(idx)) {
                    cardEl.classList.add('matched');
                    cardEl.textContent = symbol;
                } else {
                    cardEl.textContent = '❓';
                    cardEl.onclick = () => flipCard(idx, symbol);
                }
                grid.appendChild(cardEl);
            });
        }

        window.startCardGame = function() {
            document.getElementById('start-btn').style.display = 'none';
        };

        window.flipCard = async function(idx, symbol) {
            if (roomData.current_turn !== currentUser.id || roomData.status === 'finished') return;
            const matched = roomData.matched_indices || [];
            if (matched.includes(idx)) return;

            const gridCards = document.getElementById('memory-grid').children;
            gridCards[idx].classList.add('flipped');
            gridCards[idx].textContent = symbol;

            flippedCards.push({ idx, symbol });

            if (flippedCards.length === 2) {
                const [card1, card2] = flippedCards;
                flippedCards = [];

                if (card1.symbol === card2.symbol && card1.idx !== card2.idx) {
                    const newMatched = [...matched, card1.idx, card2.idx];
                    const isHost = (roomData.host_id === currentUser.id);
                    let p1Score = roomData.p1_score || 0;
                    let p2Score = roomData.p2_score || 0;

                    if (isHost) p1Score++; else p2Score++;

                    const isFinished = newMatched.length >= 16;

                    await supabase.from('game_rooms').update({
                        matched_indices: newMatched,
                        p1_score: p1Score,
                        p2_score: p2Score,
                        status: isFinished ? 'finished' : 'playing'
                    }).eq('room_code', roomCode);

                    if (isFinished) checkGameResult(p1Score, p2Score);
                } else {
                    setTimeout(async () => {
                        const nextTurn = (roomData.host_id === currentUser.id) ? roomData.guest_id : roomData.host_id;
                        await supabase.from('game_rooms').update({ current_turn: nextTurn }).eq('room_code', roomCode);
                    }, 800);
                }
            }
        };

        async function checkGameResult(p1Score, p2Score) {
            if (hasFinishedGame) return;
            hasFinishedGame = true;

            const isHost = (roomData.host_id === currentUser.id);
            let myScore = isHost ? p1Score : p2Score;
            let enemyScore = isHost ? p2Score : p1Score;

            if (myScore > enemyScore) {
                showPopup(`🎉 ยินดีด้วยคุณชนะ!\nกวาดเงินกองกลาง ${roomData.bet_pool} Gold!`, async () => { await rewardWinner(); });
            } else if (myScore < enemyScore) {
                showPopup(`💀 คุณพ่ายแพ้ในเกมจับคู่การ์ด!`, async () => { window.location.href = 'mini-game.html'; });
            } else {
                showPopup(`🤝 เสมอกัน! คืนเงินเดิมพัน`, async () => { await refundBet(); });
            }
        }

        async function rewardWinner() {
            const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
            if (bank) {
                await supabase.from('bank_accounts').update({ gold: Number(bank.gold) + Number(roomData.bet_pool) }).eq('id', currentUser.id);
            }
            window.location.href = 'mini-game.html';
        }

        async function refundBet() {
            const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
            if (bank) {
                await supabase.from('bank_accounts').update({ gold: Number(bank.gold) + betAmount }).eq('id', currentUser.id);
            }
            window.location.href = 'mini-game.html';
        }

        window.confirmLeaveRoom = function() {
            if (hasFinishedGame || roomData?.status === 'waiting') {
                leaveRoomAction();
                return;
            }
            showPopup('⚠️ คำเตือน!\nหากคุณออกระหว่างเกม จะต้องเสียค่าปรับ 5 Gold ยืนยันการออกหรือไม่?', async () => {
                await applyLeavePenaltyAndExit();
            }, true);
        };

        async function applyLeavePenaltyAndExit() {
            isLeaving = true;
            const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
            if (bank) {
                await supabase.from('bank_accounts').update({ gold: Math.max(0, Number(bank.gold) - 5) }).eq('id', currentUser.id);
            }
            await cleanupAndExit();
        }

        async function leaveRoomAction() {
            isLeaving = true;
            await cleanupAndExit();
        }

        async function cleanupAndExit() {
            if (roomData && roomData.host_id === currentUser.id) {
                await supabase.from('game_rooms').delete().eq('room_code', roomCode);
            }
            window.location.href = 'mini-game.html';
        }
    </script>
</body>
</html>
