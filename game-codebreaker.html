<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - Code Breaker Duel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; padding-bottom: 40px; }
        .header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: none; border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .back-btn:hover { border-color: var(--border-focus); }
        .page-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .section-heading { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        
        .players-container { display: flex; gap: 10px; margin-bottom: 16px; }
        .player-box { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 40px; height: 40px; border-radius: 50%; background: #262626; object-fit: cover; border: 1px solid var(--border-color); }
        .player-info { display: flex; flex-direction: column; overflow: hidden; }
        .player-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-role { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-top: 2px; }

        .status-box { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 15px; padding: 12px 14px; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; align-items: center; }
        .code-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .code-input { width: 50px; height: 60px; background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 24px; font-weight: 700; text-align: center; outline: none; }
        .code-input:focus { border-color: var(--border-focus); }
        
        .action-btn { width: 100%; padding: 12px; background: var(--accent-color); color: var(--btn-text); border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .action-btn:disabled { background: #262626; color: #666; cursor: not-allowed; }
        
        .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; }
        .hints { letter-spacing: 2px; font-weight: bold; }

        #popup-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1300; padding: 20px; }
        .popup-content { background: #141414; border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; text-align: center; max-width: 360px; width: 100%; }
        .popup-message { font-size: 13px; margin-bottom: 20px; color: var(--text-primary); line-height: 1.6; white-space: pre-line; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); text-align: left; }
        .popup-btn { padding: 10px 24px; background: var(--accent-color); color: var(--btn-text); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-nav">
            <a href="minigame.html" class="back-btn">ออกห้องเกม</a>
            <h1 class="page-title">Code Breaker</h1>
            <span id="room-badge" style="font-size: 11px; color: var(--text-secondary); font-weight: bold;">ห้อง: ----</span>
        </div>

        <div class="players-container" id="players-container">
            <div class="player-box">
                <img src="https://via.placeholder.com/40" class="player-avatar" id="p1-avatar">
                <div class="player-info">
                    <span class="player-name" id="p1-name">กำลังโหลด...</span>
                    <span class="player-role" id="p1-role">Host</span>
                </div>
            </div>
            <div class="player-box" id="p2-box" style="opacity: 0.4;">
                <img src="https://via.placeholder.com/40" class="player-avatar" id="p2-avatar">
                <div class="player-info">
                    <span class="player-name" id="p2-name">รอผู้เล่น...</span>
                    <span class="player-role" id="p2-role">Guest</span>
                </div>
            </div>
        </div>

        <div class="status-box">
            <span id="player-role-text">กำลังเชื่อมต่อระบบ...</span>
            <span id="turn-status-text" style="font-weight: 600; color: #aaa;">รอผู้เล่นคนที่ 2...</span>
        </div>

        <div class="card" id="gameplay-card">
            <p class="section-heading">กรอกรหัสลับ 5 หลัก (0-9)</p>
            <div class="code-inputs">
                <input type="text" inputmode="numeric" maxlength="1" class="code-input">
                <input type="text" inputmode="numeric" maxlength="1" class="code-input">
                <input type="text" inputmode="numeric" maxlength="1" class="code-input">
                <input type="text" inputmode="numeric" maxlength="1" class="code-input">
                <input type="text" inputmode="numeric" maxlength="1" class="code-input">
            </div>
            <button type="button" class="action-btn" id="submit-guess-btn" disabled onclick="submitGuess()">ยืนยันการทายรหัส</button>
        </div>

        <div class="card">
            <p class="section-heading">ประวัติการถอดรหัสในห้อง</p>
            <div class="history-list" id="history-list">
                <div id="empty-history" style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 10px;">รอเริ่มการดวล...</div>
            </div>
        </div>
    </div>

    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room') || '0000';
        const gameMode = urlParams.get('mode') || 'create';

        let secretCode = '';
        let isMyTurn = false;
        let gameActive = false;
        let channel = null;

        function showPopup(msg, cb = null) {
            document.getElementById('popup-text').textContent = msg;
            document.getElementById('popup-modal').style.display = 'flex';
            window.popupCallback = cb;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (window.popupCallback) { window.popupCallback(); window.popupCallback = null; }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('room-badge').textContent = `ห้อง: ${roomCode}`;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const { data: prof } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            userProfile = prof || { name: 'ผู้เล่น', avatar_url: '' };

            const defaultAvatar = 'https://api.iconify.design/solar:user-circle-bold.svg?color=%23888888';
            const myAvatar = userProfile.avatar_url || defaultAvatar;

            if (gameMode === 'create') {
                document.getElementById('p1-name').textContent = userProfile.name || 'Host';
                document.getElementById('p1-avatar').src = myAvatar;
                document.getElementById('p1-role').textContent = 'Host (คุณ)';
            } else {
                document.getElementById('p2-box').style.opacity = '1';
                document.getElementById('p2-name').textContent = userProfile.name || 'Guest';
                document.getElementById('p2-avatar').src = myAvatar;
                document.getElementById('p2-role').textContent = 'Guest (คุณ)';
            }

            channel = supabase.channel(`room_cog_${roomCode}`, {
                config: { 
                    broadcast: { self: true },
                    presence: { key: currentUser.id } 
                }
            });

            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const userIds = Object.keys(state);

                    userIds.forEach(id => {
                        const metas = state[id];
                        if (metas && metas[0]) {
                            const pData = metas[0];
                            const avt = pData.avatar || defaultAvatar;
                            if (pData.role === 'create') {
                                document.getElementById('p1-name').textContent = pData.name;
                                document.getElementById('p1-avatar').src = avt;
                                document.getElementById('p1-role').textContent = 'Host';
                            } else {
                                document.getElementById('p2-box').style.opacity = '1';
                                document.getElementById('p2-name').textContent = pData.name;
                                document.getElementById('p2-avatar').src = avt;
                                document.getElementById('p2-role').textContent = 'Guest';
                            }
                        }
                    });

                    if (userIds.length >= 2 && !gameActive) {
                        startDuel();
                    }
                })
                .on('broadcast', { event: 'game_action' }, payload => {
                    handleGameMessage(payload.payload);
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({ 
                            name: userProfile.name || 'ผู้เล่น', 
                            id: currentUser.id, 
                            avatar: userProfile.avatar_url, 
                            role: gameMode 
                        });

                        if (gameMode === 'create') {
                            secretCode = Math.floor(10000 + Math.random() * 90000).toString();
                            document.getElementById('player-role-text').textContent = 'คุณเป็น Host (ผู้สร้างห้อง)';
                            document.getElementById('turn-status-text').textContent = 'รอผู้เล่นอีกคนเข้ามา...';
                            console.log("Secret Code (Host):", secretCode);
                        } else {
                            document.getElementById('player-role-text').textContent = 'คุณเป็น Guest (ผู้ท้าชิง)';
                            document.getElementById('turn-status-text').textContent = 'กำลังซิงค์กับ Host...';
                        }
                    }
                });

            const inputs = document.querySelectorAll('.code-input');
            inputs.forEach((inp, idx) => {
                inp.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    if (e.target.value.length >= 1 && idx < inputs.length - 1) inputs[idx + 1].focus();
                });
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) inputs[idx - 1].focus();
                });
            });
        });

        function startDuel() {
            if (gameActive) return;
            gameActive = true;
            if (gameMode === 'create') {
                isMyTurn = true;
                document.getElementById('turn-status-text').textContent = 'ตาของคุณทาย!';
                document.getElementById('submit-guess-btn').disabled = false;
                channel.send({
                    type: 'broadcast', event: 'game_action',
                    action: 'init_secret', secret: secretCode
                });
            } else {
                isMyTurn = false;
                document.getElementById('turn-status-text').textContent = 'รอ Host ทาย...';
                document.getElementById('submit-guess-btn').disabled = true;
            }
            showPopup('ผู้เล่นครบ 2 คนแล้ว! เริ่มดวลถอดรหัสได้');
        }

        function handleGameMessage(data) {
            if (data.action === 'init_secret' && gameMode === 'join') {
                secretCode = data.secret;
                console.log("Secret Code Received (Guest):", secretCode);
            } else if (data.action === 'submit_guess') {
                appendHistory(data.playerName, data.guess, data.hints);

                if (data.isWin) {
                    gameActive = false;
                    document.getElementById('submit-guess-btn').disabled = true;
                    if (data.winnerId === currentUser.id) {
                        showPopup('🎉 ยินดีด้วย! คุณทายรหัสถูกต้องและชนะการดวล!', rewardWinner);
                    } else {
                        showPopup(`❌ คู่ต่อสู้ (${data.playerName}) ทายถูกก่อน! รหัสคือ ${secretCode}`, penalizeLoser);
                    }
                } else {
                    // สลับตาผู้เล่น
                    if (data.senderId !== currentUser.id) {
                        isMyTurn = true;
                        document.getElementById('turn-status-text').textContent = 'ตาของคุณทาย!';
                        document.getElementById('submit-guess-btn').disabled = false;
                    } else {
                        isMyTurn = false;
                        document.getElementById('turn-status-text').textContent = 'รอคู่ต่อสู้ทาย...';
                        document.getElementById('submit-guess-btn').disabled = true;
                    }
                }
            }
        }

        window.submitGuess = async function() {
            if (!gameActive || !isMyTurn) return;

            const inputs = document.querySelectorAll('.code-input');
            let guess = '';
            inputs.forEach(inp => guess += inp.value.trim());

            if (guess.length !== 5) {
                showPopup('กรุณากรอกรหัสให้ครบ 5 หลัก');
                return;
            }

            // คำนวณคำใบ้ ⚪⚫
            let bulls = 0, cows = 0;
            let secretArr = secretCode.split(''), guessArr = guess.split('');
            let sMatch = [false,false,false,false,false], gMatch = [false,false,false,false,false];

            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) { bulls++; sMatch[i] = true; gMatch[i] = true; }
            }
            for (let i = 0; i < 5; i++) {
                if (gMatch[i]) continue;
                for (let j = 0; j < 5; j++) {
                    if (!sMatch[j] && guessArr[i] === secretArr[j]) { cows++; sMatch[j] = true; break; }
                }
            }

            let hints = '⚫'.repeat(bulls) + '⚪'.repeat(cows);
            if (!hints) hints = '❌ (ไม่มีตัวเลขที่ถูกต้อง)';

            const isWin = (bulls === 5);

            await channel.send({
                type: 'broadcast', event: 'game_action',
                action: 'submit_guess',
                senderId: currentUser.id,
                playerName: userProfile.name || 'ผู้เล่น',
                guess: guess,
                hints: hints,
                isWin: isWin,
                winnerId: currentUser.id
            });

            inputs.forEach(inp => inp.value = '');
            inputs[0].focus();
        };

        function appendHistory(name, guess, hints) {
            const list = document.getElementById('history-list');
            const emptyMsg = document.getElementById('empty-history');
            if (emptyMsg) emptyMsg.remove();

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span><b>${name}</b> ทาย: <b style="letter-spacing:2px;">${guess}</b></span><span class="hints">${hints}</span>`;
            list.prepend(item);
        }

        async function rewardWinner() {
            const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
            if (bank) {
                await supabase.from('bank_accounts').update({ gold: Number(bank.gold) + 5 }).eq('id', currentUser.id);
            }
            window.location.href = 'minigame.html';
        }

        async function penalizeLoser() {
            const { data: prof } = await supabase.from('profiles').select('hp').eq('id', currentUser.id).single();
            if (prof) {
                await supabase.from('profiles').update({ hp: Math.max(0, Number(prof.hp) - 20) }).eq('id', currentUser.id);
            }
            window.location.href = 'minigame.html';
        }
    </script>
</body>
</html>
