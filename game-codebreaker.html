<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - Code Breaker Duel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-heading {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .status-box {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 15px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .code-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .code-input {
            width: 50px;
            height: 60px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .code-input:focus {
            border-color: var(--border-focus);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--accent-hover);
        }

        .action-btn:disabled {
            background: #333;
            color: #777;
            cursor: not-allowed;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
        }

        .hints {
            letter-spacing: 3px;
            font-weight: bold;
        }

        /* ป๊อปอัพสไตล์ CoG */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบบน -->
        <div class="header-nav">
            <a href="minigame.html" class="back-btn">ออกห้องเกม</a>
            <h1 class="page-title">Code Breaker</h1>
            <span id="room-badge" style="font-size: 11px; color: var(--text-secondary);">ห้อง: ----</span>
        </div>

        <!-- สถานะเกม -->
        <div class="status-box">
            <span id="player-role-text">กำลังโหลดข้อมูลห้อง...</span>
            <span id="turn-status-text" style="font-weight: 600;">รอผู้เล่นอื่น...</span>
        </div>

        <!-- แผงควบคุมการทายรหัส 5 หลัก -->
        <div class="card" id="gameplay-card" style="display: none;">
            <p class="section-heading">กรอกรหัสลับ 5 หลัก (0-9)</p>
            <div class="code-inputs">
                <input type="number" class="code-input" maxlength="1" min="0" max="9" data-index="0">
                <input type="number" class="code-input" maxlength="1" min="0" max="9" data-index="1">
                <input type="number" class="code-input" maxlength="1" min="0" max="9" data-index="2">
                <input type="number" class="code-input" maxlength="1" min="0" max="9" data-index="3">
                <input type="number" class="code-input" maxlength="1" min="0" max="9" data-index="4">
            </div>
            <button type="button" class="action-btn" id="submit-guess-btn" onclick="submitGuess()">ยืนยันการทายรหัส</button>
        </div>

        <!-- บันทึกการทาย -->
        <div class="card">
            <p class="section-heading">ประวัติการถอดรหัสในห้อง</p>
            <div class="history-list" id="history-list">
                <div style="text-align: center; color: var(--text-secondary); font-size: 12px; padding: 10px;">ยังไม่มีการทายรหัสในรอบนี้</div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือนเท่ๆ -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ควบคุมเกม Code Breaker ผ่าน Supabase Realtime Broadcast -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;
        let urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room') || '1234';
        let gameMode = urlParams.get('mode') || 'create'; // create หรือ join

        let secretCode = ''; // รหัสลับ 5 หลักประจำห้อง (Host สุ่มสร้างแล้วบรออดแคสต์บอก)
        let isMyTurn = false;
        let gameActive = false;
        let channel = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            window.popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (window.popupCallback) {
                window.popupCallback();
                window.popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('room-badge.textContent = `ห้อง: ${roomCode}`;');
            document.getElementById('room-badge').textContent = `ห้อง: ${roomCode}`;

            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            // ดึงข้อมูลโปรไฟล์ผู้เล่น
            const { data: prof } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            userProfile = prof;

            // ตั้งค่า Realtime Channel ตามรหัสห้อง
            channel = supabase.channel(`codebreaker_${roomCode}`, {
                config: { broadcast: { self: true } }
            });

            channel
                .on('broadcast', { event: 'game_action' }, payload => {
                    handleGameMessage(payload.payload);
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        if (gameMode === 'create') {
                            // Host สุ่มรหัสลับ 5 หลัก
                            secretCode = Math.floor(10000 + Math.random() * 90000).toString();
                            isMyTurn = true;
                            gameActive = true;
                            updateUIStatus('คุณเป็น Host (ผู้สร้างห้อง)', 'ตาของคุณทายรหัส!');
                            document.getElementById('gameplay-card').style.display = 'block';
                            console.log("Secret Code (Debug):", secretCode);
                        } else {
                            // Joiner แจ้งตัวตนว่าเข้าห้องแล้ว ขอซิงค์ข้อมูลจาก Host
                            updateUIStatus('คุณเข้าร่วมห้องสำเร็จ', 'รอ Host เริ่มเกม / สุ่มรหัส...');
                            await channel.send({
                                type: 'broadcast',
                                event: 'game_action',
                                action: 'join_room',
                                senderName: userProfile.name
                            });
                        }
                    }
                });

            // ออโต้โฟกัสช่องกรอกรหัส
            const inputs = document.querySelectorAll('.code-input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        });

        function updateUIStatus(roleText, turnText) {
            document.getElementById('player-role-text').textContent = roleText;
            document.getElementById('turn-status-text').textContent = turnText;
        }

        async function handleGameMessage(data) {
            if (data.action === 'join_room' && gameMode === 'create' && gameActive) {
                showPopup(`ผู้เล่น ${data.senderName} เข้าห้องมาแล้ว! เริ่มเกมดวลถอดรหัสกันเลย`);
                // ส่งรหัสลับไปให้ฝั่ง Joiner ทราบ
                await channel.send({
                    type: 'broadcast',
                    event: 'game_action',
                    action: 'sync_secret',
                    secret: secretCode
                });
            } else if (data.action === 'sync_secret' && gameMode === 'join') {
                secretCode = data.secret;
                gameActive = true;
                isMyTurn = false; // Joiner รอให้ตาแรกฝั่ง Host ก่อน หรือสลับกัน
                updateUIStatus('คุณเป็นผู้ท้าชิง (Guest)', 'ตากล้องฝั่งตรงข้ามกำลังทาย...');
                document.getElementById('gameplay-card').style.display = 'block';
            } else if (data.action === 'submit_guess') {
                // แสดงประวัติการทาย
                appendHistory(data.playerName, data.guess, data.hints);

                if (data.isWin) {
                    gameActive = false;
                    if (data.winnerId === currentUser.id) {
                        showPopup('🎉 ยินดีด้วย! คุณทายรหัสลับถูกต้องก่อน และชนะการดวล!', async () => {
                            await rewardWinner();
                        });
                    } else {
                        showPopup(`❌ น่าเสียดาย! คู่ต่อสู้ (${data.playerName}) ทายรหัสลับ ${secretCode} ถูกต้องก่อน คุณแพ้!`, async () => {
                            await penalizeLoser();
                        });
                    }
                } else {
                    // สลับตา
                    if (data.senderId !== currentUser.id) {
                        isMyTurn = true;
                        updateUIStatus('สถานะ: กำลังดวล', 'ตาของคุณทายรหัส!');
                    } else {
                        isMyTurn = false;
                        updateUIStatus('สถานะ: กำลังดวล', 'รอคู่ต่อสู้ทายรหัส...');
                    }
                }
            }
        }

        window.submitGuess = async function() {
            if (!gameActive) {
                showPopup('เกมยังไม่เริ่ม หรือจบลงแล้ว');
                return;
            }
            if (!isMyTurn) {
                showPopup('ยังไม่ใช่ตาของคุณ กรุณารอคู่ต่อสู้');
                return;
            }

            const inputs = document.querySelectorAll('.code-input');
            let guess = '';
            inputs.forEach(inp => guess += inp.value);

            if (guess.length !== 5) {
                showPopup('กรุณากรอกตัวเลขให้ครบ 5 หลัก');
                return;
            }

            // คำนวณคำใบ้ ⚪⚫ (⚪ = ถูกตัวเลขแต่ผิดตำแหน่ง, ⚫ = ถูกทั้งตัวเลขและตำแหน่ง)
            let bulls = 0; // ⚫
            let cows = 0;  // ⚪
            let secretArr = secretCode.split('');
            let guessArr = guess.split('');

            let sMatch = [false, false, false, false, false];
            let gMatch = [false, false, false, false, false];

            // เช็ค ⚫ (Bulls)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) {
                    bulls++;
                    sMatch[i] = true;
                    gMatch[i] = true;
                }
            }

            // เช็ค ⚪ (Cows)
            for (let i = 0; i < 5; i++) {
                if (gMatch[i]) continue;
                for (let j = 0; j < 5; j++) {
                    if (!sMatch[j] && guessArr[i] === secretArr[j]) {
                        cows++;
                        sMatch[j] = true;
                        break;
                    }
                }
            }

            let hintStr = '⚫'.repeat(bulls) + '⚪'.repeat(cows);
            if (hintStr === '') hintStr = '❌ (ไม่มีเลขตรงกันเลย)';

            let isWin = (bulls === 5);

            // ส่งข้อมูลการทายผ่าน Realtime Broadcast
            await channel.send({
                type: 'broadcast',
                event: 'game_action',
                action: 'submit_guess',
                senderId: currentUser.id,
                playerName: userProfile.name,
                guess: guess,
                hints: hintStr,
                isWin: isWin,
                winnerId: currentUser.id
            });

            // ล้างช่องกรอก
            inputs.forEach(inp => inp.value = '');
            inputs[0].focus();
        };

        function appendHistory(name, guess, hints) {
            const list = document.getElementById('history-list');
            // ลบข้อความตัวอักษรเริ่มต้นถ้ามี
            if (list.children.length === 1 && list.children[0].tagName === 'DIV' && list.children[0].style.color) {
                list.innerHTML = '';
            }
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span><b>${name}</b> ทาย: <b style="letter-spacing:2px;">${guess}</b></span><span class="hints">${hints}</span>`;
            list.prepend(item);
        }

        async function rewardWinner() {
            // ผู้ชนะได้รับ +5 Gold เข้าธนาคารส่วนตัวตามกฎกติกา
            const { data: bank } = await supabase.from('bank_accounts').select('gold').eq('id', currentUser.id).single();
            if (bank) {
                const newGold = Number(bank.gold) + 5;
                await supabase.from('bank_accounts').update({ gold: newGold }).eq('id', currentUser.id);
            }
            window.location.href = 'minigame.html';
        }

        async function penalizeLoser() {
            // ฝ่ายแพ้ถูกลด HP ลง 20 หน่วย
            const { data: prof } = await supabase.from('profiles').select('hp').eq('id', currentUser.id).single();
            if (prof) {
                const newHp = Math.max(0, Number(prof.hp) - 20);
                await supabase.from('profiles').update({ hp: newHp }).eq('id', currentUser.id);
            }
            window.location.href = 'minigame.html';
        }
    </script>
</body>
</html>
