<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ตารางจัดอันดับ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px; /* เว้นระยะห่างระหว่างปุ่มกลับหน้าหลักและชื่อแอป */
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap; /* บังคับให้ปุ่มแสดงผลเป็นบรรทัดเดียว */
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* เมนูแท็บหมวดหมู่ */
        .tab-menu {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--text-primary);
            color: var(--btn-text);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* รายการจัดอันดับ */
        .rank-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .rank-item:hover {
            border-color: var(--border-focus);
        }

        .rank-number {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            width: 24px;
            text-align: center;
        }

        .rank-item:nth-child(1) .rank-number { color: #f39c12; }
        .rank-item:nth-child(2) .rank-number { color: #bdc3c7; }
        .rank-item:nth-child(3) .rank-number { color: #d35400; }

        .rank-avatar {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #262626;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #555;
            flex-shrink: 0;
        }

        .rank-info {
            flex: 1;
        }

        .rank-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .rank-details {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .empty-ranking {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Leaderboard</h1>
        </div>

        <!-- แท็บสลับหมวดหมู่ -->
        <div class="tab-menu">
            <button type="button" class="tab-btn active" onclick="switchTab('guild')">อันดับกิลด์</button>
            <button type="button" class="tab-btn" onclick="switchTab('player')">อันดับผู้เล่น</button>
        </div>

        <!-- หมวดอันดับกิลด์ -->
        <div id="content-guild" class="tab-content active">
            <div class="card">
                <p class="section-heading">กิลด์ยอดเยี่ยม</p>
                <div id="guild-leaderboard-container">
                    <div class="empty-ranking">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>

        <!-- หมวดอันดับผู้เล่น -->
        <div id="content-player" class="tab-content">
            <div class="card">
                <p class="section-heading">ผู้เล่นยอดเยี่ยม</p>
                <div id="player-leaderboard-container">
                    <div class="empty-ranking">กำลังโหลดข้อมูล...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script ทำงานหน้า Leaderboard -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'guild') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('content-guild').classList.add('active');
            } else if (tabName === 'player') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('content-player').classList.add('active');
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            await loadGuildLeaderboard();
            await loadPlayerLeaderboard();
        });

        // โหลดอันดับกิลด์ (เรียงตาม Level สูงสุด และ Total Missions)
        async function loadGuildLeaderboard() {
            const container = document.getElementById('guild-leaderboard-container');
            const { data: guilds, error } = await supabase.from('guilds')
                .select('*')
                .order('level', { ascending: false })
                .order('total_missions', { ascending: false });

            if (error || !guilds || guilds.length === 0) {
                container.innerHTML = '<div class="empty-ranking">ยังไม่มีข้อมูลกิลด์ในระบบ</div>';
                return;
            }

            container.innerHTML = '';
            guilds.forEach((g, index) => {
                const item = document.createElement('div');
                item.className = 'rank-item';

                const avatarHtml = g.avatar_url 
                    ? `<img src="${g.avatar_url}" class="rank-avatar">` 
                    : `<div class="rank-avatar">🛡️</div>`;

                item.innerHTML = `
                    <div class="rank-number">#${index + 1}</div>
                    ${avatarHtml}
                    <div class="rank-info">
                        <div class="rank-name">${g.name}</div>
                        <div class="rank-details">เลเวล ${g.level} | ภารกิจสะสมรวม: ${g.total_missions || 0} ครั้ง</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // โหลดอันดับผู้เล่น (เรียงตาม Level สูงสุด และ Total Missions)
        async function loadPlayerLeaderboard() {
            const container = document.getElementById('player-leaderboard-container');
            const { data: players, error } = await supabase.from('profiles')
                .select('*')
                .order('level', { ascending: false })
                .order('total_missions', { ascending: false });

            if (error || !players || players.length === 0) {
                container.innerHTML = '<div class="empty-ranking">ยังไม่มีข้อมูลผู้เล่นในระบบ</div>';
                return;
            }

            container.innerHTML = '';
            players.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'rank-item';

                const avatarHtml = p.avatar_url 
                    ? `<img src="${p.avatar_url}" class="rank-avatar">` 
                    : `<div class="rank-avatar">👤</div>`;

                item.innerHTML = `
                    <div class="rank-number">#${index + 1}</div>
                    ${avatarHtml}
                    <div class="rank-info">
                        <div class="rank-name">${p.name} (@${p.username})</div>
                        <div class="rank-details">เลเวล ${p.level} | ภารกิจที่ทำทั้งหมด: ${p.total_missions || 0} ครั้ง</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
