<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ร้านค้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* แสดงยอดเงิน Gold เฉพาะช่องเดียว */
        .wallet-box {
            display: flex;
            justify-content: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .wallet-item strong {
            display: block;
            font-size: 16px;
            color: #fff;
            margin-bottom: 2px;
        }

        .wallet-item span {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ตารางสินค้า (Grid) */
        .store-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .store-item-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: border-color 0.2s;
        }

        .store-item-card:hover {
            border-color: var(--border-focus);
        }

        .item-img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background-color: #262626;
            object-fit: cover;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #555;
        }

        .item-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }

        .item-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            flex: 1;
            line-height: 1.3;
        }

        .item-price {
            font-size: 12px;
            font-weight: 600;
            color: #f39c12;
            margin-bottom: 10px;
        }

        .buy-btn {
            width: 100%;
            padding: 8px;
            background-color: var(--text-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .buy-btn:hover {
            background-color: var(--accent-hover);
        }

        .coming-soon {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Store</h1>
            <div style="width: 75px;"></div>
        </div>

        <!-- แสดงยอดเงิน Gold ในธนาคารส่วนตัวของผู้เล่น -->
        <div class="wallet-box">
            <div class="wallet-item">
                <strong id="user-gold">0.00</strong>
                <span>Gold</span>
            </div>
        </div>

        <!-- รายการสินค้าในร้านค้า -->
        <div class="card">
            <p class="section-heading">รายการสินค้า</p>
            <div id="store-items-container">
                <div class="coming-soon">Coming Soon</div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ทำงานหน้าร้านค้า -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userBank = null;
        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            await loadUserData();
            await loadStoreItems();
        });

        async function loadUserData() {
            const { data: bank } = await supabase.from('bank_accounts').select('*').eq('id', currentUser.id).maybeSingle();
            if (bank) {
                userBank = bank;
                // คำนวณยอดเงินรวม (Gold + Silver แปลงเป็น Gold) เพื่อแสดงผลเป็นหน่วย Gold อย่างเดียว
                let totalGold = Number(bank.gold) + (Number(bank.silver) / 100);
                document.getElementById('user-gold').textContent = totalGold.toLocaleString('en-US', { minimumFractionDigits: totalGold % 1 !== 0 ? 2 : 0 });
            }
        }

        async function loadStoreItems() {
            const container = document.getElementById('store-items-container');
            container.innerHTML = '';

            const { data: items, error } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });

            if (error || !items || items.length === 0) {
                container.innerHTML = '<div class="coming-soon">Coming Soon</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'store-grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'store-item-card';

                const imgHtml = item.image_url 
                    ? `<img src="${item.image_url}" class="item-img">` 
                    : `<div class="item-img">📦</div>`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.description || 'ไม่มีรายละเอียด'}</div>
                    <div class="item-price">${item.price} ${item.currency}</div>
                    <button type="button" class="buy-btn" onclick="buyItem('${item.id}', '${item.name}', ${item.price}, '${item.currency}', '${item.image_url || ''}', '${item.description || ''}')">ซื้อสินค้า</button>
                `;
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        window.buyItem = async function(itemId, itemName, itemPrice, itemCurrency, imageUrl, description) {
            if (!userBank) return;

            let currentGold = Number(userBank.gold);
            let currentSilver = Number(userBank.silver);

            // คำนวณหักเงิน (รองรับกรณีสินค้าคิดราคาเป็น Gold หรือ Silver โดยแปลงเป็นหน่วยย่อยเพื่อความแม่นยำ)
            let totalSilverUser = (currentGold * 100) + currentSilver;
            let totalSilverCost = itemCurrency === 'Gold' ? (itemPrice * 100) : itemPrice;

            if (totalSilverUser < totalSilverCost) {
                showPopup('ยอดเงิน Gold ในบัญชีของคุณไม่เพียงพอสำหรับการซื้อสินค้านี้');
                return;
            }

            let remainingSilver = totalSilverUser - totalSilverCost;
            currentGold = Math.floor(remainingSilver / 100);
            currentSilver = remainingSilver % 100;

            // ตัดเงินในบัญชีธนาคารส่วนตัว
            const { error: updateError } = await supabase.from('bank_accounts')
                .update({ gold: currentGold, silver: currentSilver })
                .eq('id', currentUser.id);

            if (updateError) {
                showPopup('เกิดข้อผิดพลาดในการหักเงิน กรุณาลองใหม่อีกครั้ง');
                return;
            }

            // เพิ่มไอเท็มเข้าคลังผู้เล่น (user_inventory) หรือรวมจำนวนถ้ามีชิ้นเดิมอยู่แล้ว
            const { data: existingItem } = await supabase.from('user_inventory')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('item_name', itemName)
                .maybeSingle();

            if (existingItem) {
                await supabase.from('user_inventory')
                    .update({ quantity: Number(existingItem.quantity) + 1 })
                    .eq('id', existingItem.id);
            } else {
                await supabase.from('user_inventory').insert({
                    user_id: currentUser.id,
                    item_name: itemName,
                    item_type: 'material',
                    quantity: 1,
                    image_url: imageUrl,
                    description: description
                });
            }

            showPopup(`ซื้อสินค้า "${itemName}" สำเร็จ!\nไอเท็มถูกส่งไปยังคลังเก็บของ (Inventory) แล้ว`, () => {
                location.reload();
            });
        };
    </script>
</body>
</html>
