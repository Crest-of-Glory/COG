<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ระบบเพื่อนและแชท</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* เมนูแท็บหลัก 3 หมวดหมู่ */
        .tab-menu {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .tab-btn.active {
            background-color: var(--text-primary);
            color: var(--btn-text);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, 
        .chat-input-area input,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .chat-input-area input:focus,
        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: var(--border-focus);
            background-color: #222222 !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .list-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .list-item-card:hover {
            border-color: var(--border-focus);
        }

        .user-avatar-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #262626;
            object-fit: cover;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
            overflow: hidden;
            flex-shrink: 0;
        }

        .list-info-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .list-info strong {
            display: block;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .list-info span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            border-color: var(--border-focus);
        }

        .btn-danger {
            color: #ff5555;
            border-color: rgba(255,85,85,0.3);
        }

        .btn-danger:hover {
            background: rgba(255,85,85,0.1);
        }

        /* ห้องแชท UI */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 450px;
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-bubble.incoming {
            background: #1f1f1f;
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        .message-bubble.outgoing {
            background: var(--text-primary);
            color: var(--btn-text);
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            gap: 8px;
            align-items: center;
        }

        /* ป๊อปอัพแจ้งเตือนทั่วไป */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Friendship</h1>
            <div style="width: 75px;"></div>
        </div>

        <!-- เมนูแท็บ 3 หมวดหมู่ -->
        <div class="tab-menu">
            <button type="button" class="tab-btn active" onclick="switchFriendTab('friends')">รายชื่อเพื่อน</button>
            <button type="button" class="tab-btn" onclick="switchFriendTab('chats')">ห้องแชท</button>
            <button type="button" class="tab-btn" onclick="switchFriendTab('add-friend')">เพิ่มเพื่อน</button>
        </div>

        <!-- ================= หมวด 1: รายชื่อเพื่อน ================= -->
        <div id="content-friends" class="tab-content active">
            <div class="card">
                <p class="section-heading">รายชื่อเพื่อนทั้งหมด</p>
                <div id="friends-list-container"></div>
            </div>
        </div>

        <!-- ================= หมวด 2: ห้องแชท ================= -->
        <div id="content-chats" class="tab-content">
            <div id="room-selection-view">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <p class="section-heading" style="margin-bottom: 0;">ห้องแชทของคุณ</p>
                        <button type="button" class="btn-sm" onclick="openCreateGroupModal()">+ สร้างกลุ่ม</button>
                    </div>
                    <div id="chat-rooms-container"></div>
                </div>
            </div>

            <div id="chat-room-view" style="display: none;">
                <div class="card" style="margin-bottom: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <button type="button" class="btn-sm" onclick="backToRoomList()">← กลับ</button>
                            <strong id="active-room-name" style="font-size: 14px;">ชื่อห้องแชท</strong>
                        </div>
                        <div id="room-action-btn-box"></div>
                    </div>

                    <!-- กล่องข้อความแชท -->
                    <div class="chat-container">
                        <div class="chat-messages" id="chat-messages-box"></div>
                        <div class="chat-input-area" id="chat-input-area-box">
                            <!-- ปุ่มส่งของ (จะแสดงเฉพาะแชทเดี่ยว) -->
                            <button type="button" class="btn-sm" id="send-item-btn" onclick="openSendItemModal()" title="ส่งไอเท็ม" style="display: none; font-size: 16px;">🎁</button>
                            <input type="text" id="chat-message-input" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                            <button type="button" class="btn-sm" onclick="sendChatMessage()" style="background: var(--text-primary); color: var(--btn-text); font-weight: 600;">ส่ง</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= หมวด 3: เพิ่มเพื่อน ================= -->
        <div id="content-add-friend" class="tab-content">
            <div class="card">
                <p class="section-heading">ค้นหาเพื่อนด้วย ID ผู้เล่น (8 หลัก)</p>
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="search-player-id" maxlength="8" placeholder="ระบุ ID 8 หลัก..." style="flex: 1;">
                    <button type="button" class="btn-sm" onclick="searchPlayerById()">ค้นหา</button>
                </div>
                <div id="search-player-result"></div>
            </div>

            <div class="card" style="margin-bottom: 0;">
                <p class="section-heading">คำขอเป็นเพื่อนที่ได้รับ</p>
                <div id="friend-requests-container"></div>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือนทั่วไป -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- ป๊อปอัพดูโปรไฟล์ผู้เล่น -->
    <div id="user-profile-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1100; padding: 20px;">
        <div class="popup-content" style="max-width: 380px; text-align: left;">
            <p class="section-heading" style="margin-bottom: 15px; text-align: center;">โปรไฟล์ผู้เล่น</p>
            <div id="user-profile-details" style="margin-bottom: 20px;"></div>
            <div style="display: flex; gap: 10px;" id="user-profile-action-box"></div>
        </div>
    </div>

    <!-- ป๊อปอัพสร้างกลุ่มแชท -->
    <div id="create-group-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1100; padding: 20px;">
        <div class="popup-content" style="max-width: 380px; text-align: left;">
            <p class="section-heading" style="margin-bottom: 15px; text-align: center;">สร้างกลุ่มแชทใหม่</p>
            <div class="form-group">
                <label for="group-name-input">ชื่อกลุ่ม</label>
                <input type="text" id="group-name-input" placeholder="ตั้งชื่อกลุ่ม...">
            </div>
            <div class="form-group">
                <label>เลือกเพื่อนเข้าร่วมกลุ่ม</label>
                <div id="group-friends-checkbox-list" style="max-height: 180px; overflow-y: auto; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px;"></div>
            </div>
            <button class="popup-btn" onclick="executeCreateGroup()" style="margin-bottom: 8px;">สร้างกลุ่ม</button>
            <button class="popup-btn" onclick="document.getElementById('create-group-modal').style.display='none'" style="background: #262626; color: #fff;">ยกเลิก</button>
        </div>
    </div>

    <!-- ป๊อปอัพจัดการสมาชิกกลุ่ม (สำหรับเจ้าของกลุ่ม) -->
    <div id="manage-group-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1200; padding: 20px;">
        <div class="popup-content" style="max-width: 380px; text-align: left;">
            <p class="section-heading" style="margin-bottom: 15px; text-align: center;">จัดการสมาชิกกลุ่ม</p>
            <div id="group-members-manage-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="popup-btn" onclick="document.getElementById('manage-group-modal').style.display='none'" style="background: #262626; color: #fff;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- ป๊อปอัพเลือกไอเท็มจากกระเป๋าเพื่อส่งให้เพื่อน -->
    <div id="send-item-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1150; padding: 20px;">
        <div class="popup-content" style="max-width: 380px; text-align: left;">
            <p class="section-heading" style="margin-bottom: 15px; text-align: center;">เลือกไอเท็มในกระเป๋าเพื่อส่ง</p>
            <div id="send-item-inventory-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="popup-btn" onclick="document.getElementById('send-item-modal').style.display='none'" style="background: #262626; color: #fff;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Script ทำงานระบบ Friendship & Chat -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let activeRoomId = null;
        let activeRoomReceiverId = null;
        let activeRoomIsGroup = false;
        let messageSubscription = null;
        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.switchFriendTab = function(tabName, save = true) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'friends') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('content-friends').classList.add('active');
                loadFriendsList();
            } else if (tabName === 'chats') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('content-chats').classList.add('active');
                loadChatRooms();
            } else if (tabName === 'add-friend') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('content-add-friend').classList.add('active');
                loadFriendRequests();
            }

            if (save) {
                sessionStorage.setItem('cog_friend_active_tab', tabName);
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
            currentProfile = profile;

            const savedTab = sessionStorage.getItem('cog_friend_active_tab');
            if (savedTab) {
                switchFriendTab(savedTab, false);
            } else {
                switchFriendTab('friends', false);
            }
        });

        // ================= 1. โหมดรายชื่อเพื่อน (แสดงรูป ชื่อ ยูเซอร์เนม) =================
        async function loadFriendsList() {
            const container = document.getElementById('friends-list-container');
            container.innerHTML = '';

            const { data: friendships } = await supabase.from('friendships')
                .select('*')
                .eq('status', 'accepted')
                .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);

            if (!friendships || friendships.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:15px;">ยังไม่มีรายชื่อเพื่อน</p>';
                return;
            }

            const friendIds = friendships.map(f => f.user_id === currentUser.id ? f.friend_id : f.user_id);
            const { data: friends } = await supabase.from('profiles').select('*').in('id', friendIds);

            if (!friends || friends.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:15px;">ยังไม่มีรายชื่อเพื่อน</p>';
                return;
            }

            friends.forEach(f => {
                const item = document.createElement('div');
                item.className = 'list-item-card';

                const avatarHtml = f.avatar_url 
                    ? `<img src="${f.avatar_url}" class="user-avatar-sm">` 
                    : `<div class="user-avatar-sm">${f.name ? f.name.charAt(0).toUpperCase() : '?'}</div>`;

                item.innerHTML = `
                    <div class="list-info-container" style="cursor:pointer;" onclick="openUserProfileModal('${f.id}')">
                        ${avatarHtml}
                        <div class="list-info">
                            <strong>${f.name}</strong>
                            <span>@${f.username} | เลเวล: ${f.level}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="btn-sm" onclick="startDirectChat('${f.id}', '${f.name}')">แชท</button>
                        <button type="button" class="btn-sm btn-danger" onclick="removeFriend('${f.id}')">ลบเพื่อน</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.removeFriend = async function(friendId) {
            await supabase.from('friendships').delete().or(`and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`);
            
            const { data: directRoom } = await supabase.from('chat_rooms').select('id, chat_room_members(user_id)').eq('is_group', false);
            if (directRoom) {
                for (const r of directRoom) {
                    const members = r.chat_room_members.map(m => m.user_id);
                    if (members.includes(currentUser.id) && members.includes(friendId)) {
                        await supabase.from('chat_rooms').delete().eq('id', r.id);
                    }
                }
            }

            showPopup('ลบเพื่อนเรียบร้อยแล้ว', () => loadFriendsList());
        };

        // ================= 2. โหมดห้องแชท =================
        async function loadChatRooms() {
            const container = document.getElementById('chat-rooms-container');
            container.innerHTML = '';

            const { data: myMembers } = await supabase.from('chat_room_members').select('room_id').eq('user_id', currentUser.id);
            if (!myMembers || myMembers.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:15px;">ยังไม่มีห้องแชท</p>';
                return;
            }

            const roomIds = myMembers.map(m => m.room_id);
            const { data: rooms } = await supabase.from('chat_rooms').select('*, chat_room_members(profiles(id, name, username, avatar_url))').in('id', roomIds);

            if (!rooms || rooms.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:15px;">ยังไม่มีห้องแชท</p>';
                return;
            }

            rooms.forEach(r => {
                let displayName = r.name;
                let avatarUrl = r.avatar_url;
                if (!r.is_group) {
                    const otherMember = r.chat_room_members.find(m => m.profiles && m.profiles.id !== currentUser.id);
                    if (otherMember && otherMember.profiles) {
                        displayName = otherMember.profiles.name;
                        avatarUrl = otherMember.profiles.avatar_url;
                    } else {
                        displayName = 'แชทส่วนตัว';
                    }
                }

                const avatarHtml = avatarUrl 
                    ? `<img src="${avatarUrl}" class="user-avatar-sm">` 
                    : `<div class="user-avatar-sm">${displayName ? displayName.charAt(0).toUpperCase() : '?'}</div>`;

                const item = document.createElement('div');
                item.className = 'list-item-card';
                item.onclick = () => openChatRoom(r.id, displayName, r.is_group);
                item.innerHTML = `
                    <div class="list-info-container">
                        ${avatarHtml}
                        <div class="list-info">
                            <strong>${r.is_group ? '👥 ' + displayName : displayName}</strong>
                            <span>${r.is_group ? 'แชทกลุ่ม' : 'แชทส่วนตัว'}</span>
                        </div>
                    </div>
                    <div style="font-size:11px; color:var(--text-secondary);">เปิดแชท</div>
                `;
                container.appendChild(item);
            });
        }

        window.startDirectChat = async function(friendId, friendName) {
            const { data: myRooms } = await supabase.from('chat_room_members').select('room_id, chat_rooms(is_group)').eq('user_id', currentUser.id);
            let targetRoomId = null;

            if (myRooms) {
                for (const mr of myRooms) {
                    if (mr.chat_rooms && !mr.chat_rooms.is_group) {
                        const { data: members } = await supabase.from('chat_room_members').select('user_id').eq('room_id', mr.room_id);
                        const mIds = members.map(m => m.user_id);
                        if (mIds.includes(friendId) && mIds.includes(currentUser.id)) {
                            targetRoomId = mr.room_id;
                            break;
                        }
                    }
                }
            }

            if (!targetRoomId) {
                const { data: newRoom } = await supabase.from('chat_rooms').insert({ is_group: false }).select().maybeSingle();
                targetRoomId = newRoom.id;
                await supabase.from('chat_room_members').insert([
                    { room_id: targetRoomId, user_id: currentUser.id },
                    { room_id: targetRoomId, user_id: friendId }
                ]);
            }

            switchFriendTab('chats');
            openChatRoom(targetRoomId, friendName, false, friendId);
        };

        window.openChatRoom = async function(roomId, roomName, isGroup, receiverId = null) {
            activeRoomId = roomId;
            activeRoomIsGroup = isGroup;
            activeRoomReceiverId = receiverId;

            document.getElementById('room-selection-view').style.display = 'none';
            document.getElementById('chat-room-view').style.display = 'block';
            document.getElementById('active-room-name').textContent = roomName;

            const actionBox = document.getElementById('room-action-btn-box');
            actionBox.innerHTML = '';
            if (isGroup) {
                actionBox.innerHTML = `<button type="button" class="btn-sm" onclick="openManageGroupModal('${roomId}')">จัดการกลุ่ม</button>`;
                document.getElementById('send-item-btn').style.display = 'none';
            } else {
                document.getElementById('send-item-btn').style.display = 'block';
                if (!activeRoomReceiverId) {
                    const { data: members } = await supabase.from('chat_room_members').select('user_id').eq('room_id', roomId);
                    const other = members.find(m => m.user_id !== currentUser.id);
                    if (other) activeRoomReceiverId = other.user_id;
                }
            }

            await loadChatMessages();
            subscribeToMessages();
        };

        window.backToRoomList = function() {
            if (messageSubscription) {
                supabase.removeChannel(messageSubscription);
                messageSubscription = null;
            }
            activeRoomId = null;
            document.getElementById('chat-room-view').style.display = 'none';
            document.getElementById('room-selection-view').style.display = 'block';
            loadChatRooms();
        };

        async function loadChatMessages() {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = '';

            const { data: messages } = await supabase.from('messages')
                .select('*, profiles(name)')
                .eq('room_id', activeRoomId)
                .order('created_at', { ascending: true });

            if (!messages) return;

            messages.forEach(m => {
                const bubble = document.createElement('div');
                const isMe = m.sender_id === currentUser.id;
                bubble.className = `message-bubble ${isMe ? 'outgoing' : 'incoming'}`;
                
                let senderNameHtml = '';
                if (activeRoomIsGroup && !isMe && m.profiles) {
                    senderNameHtml = `<strong style="font-size:10px; display:block; color:var(--text-secondary); margin-bottom:2px;">${m.profiles.name}</strong>`;
                }

                bubble.innerHTML = `${senderNameHtml}${m.message}`;
                box.appendChild(bubble);
            });
            box.scrollTop = box.scrollHeight;
        }

        function subscribeToMessages() {
            if (messageSubscription) supabase.removeChannel(messageSubscription);

            messageSubscription = supabase.channel('room_' + activeRoomId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${activeRoomId}` }, payload => {
                    const m = payload.new;
                    const box = document.getElementById('chat-messages-box');
                    const bubble = document.createElement('div');
                    const isMe = m.sender_id === currentUser.id;
                    bubble.className = `message-bubble ${isMe ? 'outgoing' : 'incoming'}`;
                    bubble.textContent = m.message;
                    box.appendChild(bubble);
                    box.scrollTop = box.scrollHeight;
                })
                .subscribe();
        }

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-message-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            await supabase.from('messages').insert({
                room_id: activeRoomId,
                sender_id: currentUser.id,
                message: text
            });
        };

        window.openSendItemModal = async function() {
            const { data: inv } = await supabase.from('user_inventory').select('*').eq('user_id', currentUser.id);
            const container = document.getElementById('send-item-inventory-list');
            container.innerHTML = '';

            if (!inv || inv.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center;">กระเป๋าของคุณว่างเปล่า</p>';
                document.getElementById('send-item-modal').style.display = 'flex';
                return;
            }

            inv.forEach(i => {
                const item = document.createElement('div');
                item.className = 'list-item-card';
                item.innerHTML = `
                    <div class="list-info">
                        <strong>${i.item_name} (มีอยู่: ${i.quantity})</strong>
                        <span>ประเภท: ${i.item_type}</span>
                    </div>
                    <button type="button" class="btn-sm" onclick="sendItemToFriend('${i.id}', '${i.item_name}')">ส่งให้เพื่อน</button>
                `;
                container.appendChild(item);
            });

            document.getElementById('send-item-modal').style.display = 'flex';
        };

        window.sendItemToFriend = async function(userInvId, itemName) {
            document.getElementById('send-item-modal').style.display = 'none';

            const { data: userItem } = await supabase.from('user_inventory').select('*').eq('id', userInvId).maybeSingle();
            if (!userItem || userItem.quantity <= 0) {
                showPopup('ไอเท็มชิ้นนี้หมดแล้ว');
                return;
            }

            const newQty = userItem.quantity - 1;
            if (newQty === 0) {
                await supabase.from('user_inventory').delete().eq('id', userInvId);
            } else {
                await supabase.from('user_inventory').update({ quantity: newQty }).eq('id', userInvId);
            }

            const { data: friendItem } = await supabase.from('user_inventory').select('*').eq('user_id', activeRoomReceiverId).eq('item_name', itemName).maybeSingle();
            if (friendItem) {
                await supabase.from('user_inventory').update({ quantity: friendItem.quantity + 1 }).eq('id', friendItem.id);
            } else {
                await supabase.from('user_inventory').insert({
                    user_id: activeRoomReceiverId,
                    item_name: userItem.item_name,
                    item_type: userItem.item_type,
                    quantity: 1,
                    image_url: userItem.image_url,
                    description: userItem.description
                });
            }

            await supabase.from('messages').insert({
                room_id: activeRoomId,
                sender_id: currentUser.id,
                message: `[ระบบ] ได้ส่งไอเท็ม "${itemName} (x1)" ให้คุณ`
            });

            showPopup('ส่งไอเท็มให้เพื่อนเรียบร้อยแล้ว!');
        };

        // ================= สร้างกลุ่ม (ปรับหน้าตาเลือกเพื่อนใหม่ ไม่กินพื้นที่ แสดงรูปและชื่อ) =================
        window.openCreateGroupModal = async function() {
            const { data: friendships } = await supabase.from('friendships')
                .select('*')
                .eq('status', 'accepted')
                .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);

            const container = document.getElementById('group-friends-checkbox-list');
            container.innerHTML = '';

            if (!friendships || friendships.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:10px;">คุณยังไม่มีเพื่อนสำหรับสร้างกลุ่ม</p>';
                document.getElementById('create-group-modal').style.display = 'flex';
                return;
            }

            const friendIds = friendships.map(f => f.user_id === currentUser.id ? f.friend_id : f.user_id);
            const { data: friends } = await supabase.from('profiles').select('*').in('id', friendIds);

            friends.forEach(f => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.alignItems = 'center';
                item.style.justifyContent = 'space-between';
                item.style.padding = '6px 8px';
                item.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                item.style.marginBottom = '4px';

                const avatarHtml = f.avatar_url 
                    ? `<img src="${f.avatar_url}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">` 
                    : `<div style="width:32px; height:32px; border-radius:50%; background:#262626; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:bold;">${f.name ? f.name.charAt(0).toUpperCase() : '?'}</div>`;

                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        ${avatarHtml}
                        <span style="font-size: 13px; font-weight: 500; color: #fff;">${f.name}</span>
                    </div>
                    <input type="checkbox" value="${f.id}" class="group-friend-chk" style="width: 18px; height: 18px; cursor: pointer; accent-color: #fff;">
                `;
                container.appendChild(item);
            });

            document.getElementById('group-name-input').value = '';
            document.getElementById('create-group-modal').style.display = 'flex';
        };

        window.executeCreateGroup = async function() {
            const groupName = document.getElementById('group-name-input').value.trim();
            if (!groupName) {
                showPopup('กรุณากรอกชื่อกลุ่ม');
                return;
            }

            const checkboxes = document.querySelectorAll('.group-friend-chk:checked');
            const memberIds = [currentUser.id];
            checkboxes.forEach(chk => memberIds.push(chk.value));

            if (memberIds.length < 2) {
                showPopup('กรุณาเลือกเพื่อนอย่างน้อย 1 คนเข้าร่วมกลุ่ม');
                return;
            }

            const { data: newRoom } = await supabase.from('chat_rooms').insert({
                name: groupName,
                is_group: true
            }).select().maybeSingle();

            const memberInserts = memberIds.map(uid => ({ room_id: newRoom.id, user_id: uid }));
            await supabase.from('chat_room_members').insert(memberInserts);

            document.getElementById('create-group-modal').style.display = 'none';
            showPopup('สร้างกลุ่มแชทสำเร็จ!', () => loadChatRooms());
        };

        window.openManageGroupModal = async function(roomId) {
            const { data: members } = await supabase.from('chat_room_members').select('id, user_id, profiles(id, name, username, avatar_url)').eq('room_id', roomId);
            const container = document.getElementById('group-members-manage-list');
            container.innerHTML = '';

            members.forEach(m => {
                if (!m.profiles) return;
                const p = m.profiles;
                const avatarHtml = p.avatar_url 
                    ? `<img src="${p.avatar_url}" class="user-avatar-sm">` 
                    : `<div class="user-avatar-sm">${p.name ? p.name.charAt(0).toUpperCase() : '?'}</div>`;

                const item = document.createElement('div');
                item.className = 'list-item-card';
                item.innerHTML = `
                    <div class="list-info-container">
                        ${avatarHtml}
                        <div class="list-info">
                            <strong>${p.name} ${m.user_id === currentUser.id ? '(คุณ)' : ''}</strong>
                            <span>@${p.username}</span>
                        </div>
                    </div>
                    ${m.user_id !== currentUser.id ? `<button type="button" class="btn-sm btn-danger" onclick="removeMemberFromGroup('${roomId}', '${m.user_id}')">เตะออก</button>` : ''}
                `;
                container.appendChild(item);
            });

            document.getElementById('manage-group-modal').style.display = 'flex';
        };

        window.removeMemberFromGroup = async function(roomId, userId) {
            await supabase.from('chat_room_members').delete().eq('room_id', roomId).eq('user_id', userId);
            showPopup('เตะสมาชิกออกจากกลุ่มเรียบร้อย', () => openManageGroupModal(roomId));
        };

        // ================= 3. โหมดเพิ่มเพื่อน (ตรวจสอบคำขอชนกันอัตโนมัติ) =================
        window.searchPlayerById = async function() {
            const pid = document.getElementById('search-player-id').value.trim();
            const container = document.getElementById('search-player-result');
            container.innerHTML = '';

            if (pid.length !== 8) {
                showPopup('กรุณากรอก ID ผู้เล่นให้ครบ 8 หลัก');
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('*').eq('player_id', pid).maybeSingle();
            if (!profile) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:10px;">ไม่พบผู้เล่น ID นี้ในระบบ</p>';
                return;
            }

            const avatarHtml = profile.avatar_url 
                ? `<img src="${profile.avatar_url}" class="user-avatar-sm">` 
                : `<div class="user-avatar-sm">${profile.name ? profile.name.charAt(0).toUpperCase() : '?'}</div>`;

            const item = document.createElement('div');
            item.className = 'list-item-card';
            item.onclick = () => openUserProfileModal(profile.id);
            item.innerHTML = `
                <div class="list-info-container">
                    ${avatarHtml}
                    <div class="list-info">
                        <strong>${profile.name}</strong>
                        <span>@${profile.username} | ID: ${profile.player_id}</span>
                    </div>
                </div>
                <div style="font-size:11px; color:var(--text-secondary);">ดูโปรไฟล์</div>
            `;
            container.appendChild(item);
        };

        window.openUserProfileModal = async function(userId) {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', userId).maybeSingle();
            if (!profile) return;

            const detailsBox = document.getElementById('user-profile-details');
            const actionBox = document.getElementById('user-profile-action-box');

            const avatarHtml = profile.avatar_url ? `<img src="${profile.avatar_url}" style="width:60px; height:60px; border-radius:50%; object-fit:cover; margin-bottom:10px;">` : `<div style="width:60px; height:60px; border-radius:50%; background:#262626; display:flex; align-items:center; justify-content:center; margin:0 auto 10px auto; font-weight:bold; font-size:20px;">${profile.name ? profile.name.charAt(0).toUpperCase() : '?'}</div>`;

            detailsBox.innerHTML = `
                <div style="text-align:center;">
                    ${avatarHtml}
                    <strong style="font-size:15px; display:block; margin-bottom:4px;">${profile.name || 'ไม่มีชื่อ'}</strong>
                    <span style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:12px;">@${profile.username || 'unknown'}</span>
                </div>
                <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); padding:12px; border-radius:8px; font-size:12px; line-height:1.6;">
                    <div><strong>ID ผู้เล่น:</strong> ${profile.player_id || '-'}</div>
                    <div><strong>วันเกิด:</strong> ${profile.birthday || 'ไม่ได้ระบุ'}</div>
                    <div><strong>เลเวล:</strong> ${profile.level || 1}</div>
                    <div><strong>ภารกิจทั้งหมด:</strong> ${(profile.total_missions || 0).toLocaleString('en-US')}</div>
                </div>
            `;

            actionBox.innerHTML = '';
            if (profile.id !== currentUser.id) {
                const { data: friendship } = await supabase.from('friendships')
                    .select('*')
                    .or(`and(user_id.eq.${currentUser.id},friend_id.eq.${profile.id}),and(user_id.eq.${profile.id},friend_id.eq.${currentUser.id})`)
                    .maybeSingle();

                const btn = document.createElement('button');
                btn.className = 'popup-btn';

                if (friendship) {
                    btn.style.background = '#262626';
                    btn.style.color = 'var(--text-secondary)';
                    btn.style.cursor = 'not-allowed';
                    btn.textContent = friendship.status === 'accepted' ? 'เพื่อน' : 'ส่งคำขอแล้ว';
                    btn.disabled = true;
                } else {
                    btn.style.background = 'var(--text-primary)';
                    btn.style.color = 'var(--btn-text)';
                    btn.textContent = 'เพิ่มเพื่อน';
                    btn.onclick = () => sendFriendRequest(profile.id);
                }
                actionBox.appendChild(btn);
            }

            const closeBtn = document.createElement('button');
            closeBtn.className = 'popup-btn';
            closeBtn.style.background = '#262626';
            closeBtn.style.color = '#fff';
            closeBtn.textContent = 'ปิด';
            closeBtn.onclick = () => document.getElementById('user-profile-modal').style.display = 'none';
            actionBox.appendChild(closeBtn);

            document.getElementById('user-profile-modal').style.display = 'flex';
        };

        window.sendFriendRequest = async function(friendId) {
            // เช็คว่าอีกฝ่ายส่งคำขอมาหาเราก่อนหน้านี้แล้วหรือยัง (กรณีขอชนกัน)
            const { data: reverseReq } = await supabase.from('friendships')
                .select('*')
                .eq('user_id', friendId)
                .eq('friend_id', currentUser.id)
                .eq('status', 'pending')
                .maybeSingle();

            if (reverseReq) {
                // ถ้าอีกฝ่ายเคยขอมาแล้ว ให้เปลี่ยนสถานะเป็น accepted ทันที (เป็นเพื่อนกันเลย)
                await supabase.from('friendships').update({ status: 'accepted' }).eq('id', reverseReq.id);
                showPopup('คุณและผู้เล่นนี้ส่งคำขอกันและกัน กลายเป็นเพื่อนกันเรียบร้อยแล้ว!', () => {
                    document.getElementById('user-profile-modal').style.display = 'none';
                    loadFriendRequests();
                });
            } else {
                // ส่งคำขอปกติ
                await supabase.from('friendships').insert({
                    user_id: currentUser.id,
                    friend_id: friendId,
                    status: 'pending'
                });

                showPopup('ส่งคำขอเพิ่มเพื่อนเรียบร้อยแล้ว!', () => {
                    document.getElementById('user-profile-modal').style.display = 'none';
                });
            }
        };

        async function loadFriendRequests() {
            const container = document.getElementById('friend-requests-container');
            container.innerHTML = '';

            const { data: reqs } = await supabase.from('friendships')
                .select('*, profiles!friendships_user_id_fkey(id, name, username, level, player_id, avatar_url)')
                .eq('friend_id', currentUser.id)
                .eq('status', 'pending');

            if (!reqs || reqs.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:var(--text-secondary); text-align:center; padding:10px;">ไม่มีคำขอเป็นเพื่อนในขณะนี้</p>';
                return;
            }

            reqs.forEach(r => {
                const p = r.profiles;
                if (!p) return;

                const avatarHtml = p.avatar_url 
                    ? `<img src="${p.avatar_url}" class="user-avatar-sm">` 
                    : `<div class="user-avatar-sm">${p.name ? p.name.charAt(0).toUpperCase() : '?'}</div>`;

                const item = document.createElement('div');
                item.className = 'list-item-card';
                item.innerHTML = `
                    <div class="list-info-container" style="cursor:pointer; flex:1;" onclick="openUserProfileModal('${p.id}')">
                        ${avatarHtml}
                        <div class="list-info">
                            <strong>${p.name}</strong>
                            <span>@${p.username} | ID: ${p.player_id}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button type="button" class="btn-sm" onclick="handleFriendRequest('${r.id}', 'accepted')">ยอมรับ</button>
                        <button type="button" class="btn-sm btn-danger" onclick="handleFriendRequest('${r.id}', 'rejected')">ปฏิเสธ</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.handleFriendRequest = async function(reqId, status) {
            if (status === 'accepted') {
                await supabase.from('friendships').update({ status: 'accepted' }).eq('id', reqId);
                showPopup('ยอมรับคำขอเป็นเพื่อนเรียบร้อยแล้ว!', () => loadFriendRequests());
            } else {
                await supabase.from('friendships').delete().eq('id', reqId);
                showPopup('ปฏิเสธคำขอเป็นเพื่อนแล้ว', () => loadFriendRequests());
            }
        };
    </script>
</body>
</html>
