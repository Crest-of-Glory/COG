<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ระบบแอดมิน</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* เมนูปุ่มฟังก์ชันแอดมิน */
        .admin-menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .admin-menu-btn:hover {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.05);
        }

        .admin-menu-btn span {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Admin Dashboard</h1>
        </div>

        <!-- รายการเมนูจัดการระบบ -->
        <div class="card">
            <p class="section-heading">เมนูควบคุมระบบแอดมิน</p>
            <div class="admin-menu-list">
                <a href="admin-store.html" class="admin-menu-btn">
                    จัดการ Store (ร้านค้า) <span>➔</span>
                </a>
                <a href="admin-kitchen.html" class="admin-menu-btn">
                    จัดการ Kitchen (ห้องครัว/สูตรอาหาร) <span>➔</span>
                </a>
                <a href="admin-code.html" class="admin-menu-btn">
                    จัดการ Code (โค้ดของขวัญ) <span>➔</span>
                </a>
                <a href="admin-guild.html" class="admin-menu-btn">
                    ภาพรวม Guild (กิลด์ทั้งหมด) <span>➔</span>
                </a>
                <a href="admin-quests.html" class="admin-menu-btn">
                    จัดการ Quests (ภารกิจเดี่ยว/กิลด์) <span>➔</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ตรวจสอบสิทธิ์แอดมิน -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            // ตรวจสอบข้อมูลโปรไฟล์ว่ามีสิทธิ์เป็นแอดมินหรือไม่
            const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).maybeSingle();

            if (!profile || !profile.is_admin) {
                showPopup('คุณไม่มีสิทธิ์เข้าถึงหน้าผู้ดูแลระบบ (Admin Only)', () => {
                    window.location.href = 'home.html';
                });
            }
        });
    </script>
</body>
</html>
