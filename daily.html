<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - ล็อกอินรายวันและโค้ด</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding-bottom: 40px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            gap: 15px; /* เว้นระยะห่างระหว่างปุ่มกลับหน้าหลักและชื่อแอป */
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .back-btn:hover {
            border-color: var(--border-focus);
        }

        .page-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ช่องตารางล็อกอิน 7 วัน */
        .login-days-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .day-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            font-size: 11px;
            transition: all 0.3s;
        }

        /* ช่องที่ผ่านการเช็คอินแล้วจะแสดงขอบสีขาวเด่นชัด */
        .day-box.active {
            border-color: #ffffff;
            background: rgba(255,255,255,0.08);
        }

        .day-box strong {
            display: block;
            font-size: 13px;
            margin-bottom: 2px;
            color: #fff;
        }

        .day-box span {
            color: var(--text-secondary);
            font-size: 9px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--text-primary);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .action-btn:disabled {
            background-color: #262626;
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a !important;
            border: 1px solid var(--border-color);
            border-radius: 12px !important;
            color: var(--text-primary) !important;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--border-focus);
            background-color: #222222 !important;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
        }

        /* ป๊อปอัพแจ้งเตือน */
        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1300;
            padding: 20px;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .popup-message {
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-line;
            text-align: left;
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านบน -->
        <div class="header-nav">
            <a href="home.html" class="back-btn">กลับหน้าหลัก</a>
            <h1 class="page-title">Daily Codes</h1>
        </div>

        <!-- 1. ระบบล็อกอินรายวัน -->
        <div class="card">
            <p class="section-heading">ล็อกอินรายวันรับรางวัล</p>
            <div class="login-days-grid" id="login-days-container">
                <!-- สร้างช่องวันที 1 - 7 ผ่าน JS -->
            </div>
            <button type="button" id="claim-login-btn" class="action-btn" onclick="claimDailyLogin()">รับรางวัลวันนี้</button>
        </div>

        <!-- 2. โค้ดคำเชิญเพื่อน -->
        <div class="card">
            <p class="section-heading">โค้ดคำเชิญเพื่อน (ID 8 หลัก)</p>
            <div class="form-group">
                <label for="invite-code-input">กรอก ID ผู้เล่นที่แนะนำคุณ (รับ 10 Gold)</label>
                <input type="text" id="invite-code-input" maxlength="8" placeholder="ระบุ ID 8 หลัก...">
            </div>
            <button type="button" class="action-btn" onclick="submitInvitationCode()">ยืนยันโค้ดคำเชิญ</button>
        </div>

        <!-- 3. โค้ดของขวัญจากแอดมิน -->
        <div class="card" style="margin-bottom: 0;">
            <p class="section-heading">โค้ดของขวัญ (Gift Code)</p>
            <div class="form-group">
                <label for="gift-code-input">กรอกโค้ดลับเพื่อรับไอเท็ม/เงิน</label>
                <input type="text" id="gift-code-input" placeholder="กรอกโค้ดที่นี่...">
            </div>
            <button type="button" class="action-btn" onclick="submitGiftCode()">แลกรับของรางวัล</button>
        </div>
    </div>

    <!-- ป๊อปอัพแจ้งเตือน -->
    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text"></p>
            <button class="popup-btn" id="popup-close-btn">ตกลง</button>
        </div>
    </div>

    <!-- Script ทำงานหน้า Daily Code -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let loginData = null;
        let popupCallback = null;

        function showPopup(message, callback = null) {
            document.getElementById('popup-text').textContent = message;
            document.getElementById('popup-modal').style.display = 'flex';
            popupCallback = callback;
        }

        document.getElementById('popup-close-btn').addEventListener('click', () => {
            document.getElementById('popup-modal').style.display = 'none';
            if (popupCallback) {
                popupCallback();
                popupCallback = null;
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            await checkDailyLoginStatus();
        });

        // ================= ฟังก์ชันเช็คชื่อรายวัน =================
        async function checkDailyLoginStatus() {
            const { data: login } = await supabase.from('daily_logins').select('*').eq('user_id', currentUser.id).maybeSingle();
            loginData = login;

            const container = document.getElementById('login-days-container');
            container.innerHTML = '';

            let consecutive = login ? login.consecutive_days : 0;
            let checkedDays = (consecutive % 7);
            if (checkedDays === 0 && consecutive > 0) checkedDays = 7;

            const todayStr = new Date().toISOString().split('T')[0];
            const lastLogin = login ? login.last_login_date : null;
            const alreadyClaimedToday = (lastLogin === todayStr);

            for (let i = 1; i <= 7; i++) {
                const box = document.createElement('div');
                const isActive = alreadyClaimedToday ? (i <= checkedDays) : (i < checkedDays + 1 && i <= consecutive);
                
                box.className = `day-box ${isActive ? 'active' : ''}`;
                box.innerHTML = `
                    <strong>วันที่ ${i}</strong>
                    <span>${i === 7 ? '5 Gold' : '1 Gold'}</span>
                `;
                container.appendChild(box);
            }

            const claimBtn = document.getElementById('claim-login-btn');
            if (alreadyClaimedToday) {
                claimBtn.textContent = 'รับรางวัลวันนี้แล้ว';
                claimBtn.disabled = true;
            } else {
                claimBtn.textContent = 'รับรางวัลวันนี้';
                claimBtn.disabled = false;
            }
        }

        window.claimDailyLogin = async function() {
            const todayStr = new Date().toISOString().split('T')[0];
            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = yesterdayDate.toISOString().split('T')[0];

            let consecutive = loginData ? loginData.consecutive_days : 0;
            let lastLogin = loginData ? loginData.last_login_date : null;

            if (lastLogin === todayStr) {
                showPopup('คุณได้รับรางวัลของวันนี้ไปแล้ว');
                return;
            }

            if (lastLogin === yesterdayStr) {
                consecutive += 1;
            } else {
                consecutive = 1;
            }

            let rewardGold = (consecutive % 7 === 0) ? 5 : 1;

            await supabase.from('daily_logins').update({
                consecutive_days: consecutive,
                last_login_date: todayStr
            }).eq('user_id', currentUser.id);

            const { data: bank } = await supabase.from('bank_accounts').select('*').eq('id', currentUser.id).maybeSingle();
            if (bank) {
                let newGold = Number(bank.gold) + rewardGold;
                await supabase.from('bank_accounts').update({ gold: newGold }).eq('id', currentUser.id);
            }

            showPopup(`เช็คอินสำเร็จ! คุณได้รับรางวัล ${rewardGold} Gold (ล็อกอินต่อเนื่อง ${consecutive} วัน)`, () => {
                location.reload();
            });
        };

        // ================= ฟังก์ชันกรอกโค้ดเชิญเพื่อน =================
        window.submitInvitationCode = async function() {
            const codeInput = document.getElementById('invite-code-input').value.trim();
            if (codeInput.length !== 8) {
                showPopup('กรุณากรอก ID ผู้เล่นให้ครบ 8 หลัก');
                return;
            }

            const { data: claimed } = await supabase.from('claimed_invitations').select('*').eq('user_id', currentUser.id).maybeSingle();
            if (claimed) {
                showPopup('คุณได้ทำการกรอกโค้ดคำเชิญไปเรียบร้อยแล้ว ไม่สามารถกรอกซ้ำได้');
                return;
            }

            const { data: targetProfile } = await supabase.from('profiles').select('id, player_id').eq('player_id', codeInput).maybeSingle();
            if (!targetProfile) {
                showPopup('ไม่พบผู้เล่น ID นี้ในระบบ');
                return;
            }

            if (targetProfile.id === currentUser.id) {
                showPopup('คุณไม่สามารถกรอกโค้ดเชิญของตัวเองได้');
                return;
            }

            await supabase.from('claimed_invitations').insert({
                user_id: currentUser.id,
                invited_by_player_id: codeInput
            });

            const addGoldToUser = async (uid) => {
                const { data: b } = await supabase.from('bank_accounts').select('*').eq('id', uid).maybeSingle();
                if (b) {
                    await supabase.from('bank_accounts').update({ gold: Number(b.gold) + 10 }).eq('id', uid);
                }
            };

            await addGoldToUser(currentUser.id);
            await addGoldToUser(targetProfile.id);

            showPopup('กรอกโค้ดคำเชิญสำเร็จ! คุณและเพื่อนได้รับคนละ 10 Gold เข้าบัญชีธนาคาร', () => {
                location.reload();
            });
        };

        // ================= ฟังก์ชันกรอกโค้ดของขวัญ (Gift Code) =================
        window.submitGiftCode = async function() {
            const codeText = document.getElementById('gift-code-input').value.trim();
            if (!codeText) {
                showPopup('กรุณากรอกโค้ดของขวัญ');
                return;
            }

            const { data: giftCode } = await supabase.from('gift_codes').select('*').eq('code', codeText).maybeSingle();
            if (!giftCode) {
                showPopup('โค้ดของขวัญไม่ถูกต้องหรือหมดอายุแล้ว');
                return;
            }

            const { data: alreadyClaimed } = await supabase.from('claimed_gift_codes')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('code_id', giftCode.id)
                .maybeSingle();

            if (alreadyClaimed) {
                showPopup('คุณเคยกรอกโค้ดนี้ไปแล้ว ไม่สามารถใช้ซ้ำได้');
                return;
            }

            await supabase.from('claimed_gift_codes').insert({
                user_id: currentUser.id,
                code_id: giftCode.id
            });

            if (giftCode.reward_type === 'money') {
                const { data: b } = await supabase.from('bank_accounts').select('*').eq('id', currentUser.id).maybeSingle();
                if (b) {
                    let curGold = Number(b.gold);
                    let curSilver = Number(b.silver);
                    let amt = Number(giftCode.reward_amount);

                    if (giftCode.reward_currency === 'Gold') {
                        curGold += amt;
                    } else {
                        curSilver += amt;
                        curGold += Math.floor(curSilver / 100);
                        curSilver = curSilver % 100;
                    }

                    await supabase.from('bank_accounts').update({ gold: curGold, silver: curSilver }).eq('id', currentUser.id);
                }
                showPopup(`แลกโค้ดสำเร็จ! คุณได้รับเงิน ${giftCode.reward_amount} ${giftCode.reward_currency}`);
            } else if (giftCode.reward_type === 'item') {
                const { data: existing } = await supabase.from('user_inventory')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('item_name', giftCode.reward_name)
                    .maybeSingle();

                if (existing) {
                    await supabase.from('user_inventory').update({ quantity: Number(existing.quantity) + 1 }).eq('id', existing.id);
                } else {
                    await supabase.from('user_inventory').insert({
                        user_id: currentUser.id,
                        item_name: giftCode.reward_name,
                        item_type: 'material',
                        quantity: 1,
                        description: 'ได้รับจากโค้ดของขวัญ'
                    });
                }
                showPopup(`แลกโค้ดสำเร็จ! คุณได้รับไอเท็ม "${giftCode.reward_name}" เข้าคลังเก็บของแล้ว`);
            }
        };
    </script>
</body>
</html>
