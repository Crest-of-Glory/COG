<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - เข้าสู่ระบบ / สมัครสมาชิก</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-color: #262626;
            --border-focus: #ffffff;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0b0b0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center; /* จัดกึ่งกลางหน้าจอทั้งแนวตั้งและแนวนอน */
            min-height: 100vh;
            overflow-y: auto; 
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            position: relative;
        }

        .game-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 45px; /* เว้นระยะห่างให้พอดีและดูสมดุล */
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            margin-bottom: 35px; /* เว้นระยะห่างจากแท็บไปฟอร์ม */
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            padding-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            color: var(--text-primary);
            font-weight: 600;
        }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 50%;
            height: 2px;
            background-color: var(--accent-color);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .form-group {
            margin-bottom: 25px; /* เพิ่มระยะห่างระหว่างช่องกรอกข้อมูลให้โปร่งขึ้น */
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px; /* เว้นระยะระหว่างป้ายข้อความกับช่อง input */
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--border-focus);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 25px; /* เว้นระยะห่างจากช่องรหัสผ่านมากยิ่งขึ้นไม่ให้อัดอึด */
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-message {
            font-size: 14px;
            margin-bottom: 25px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .popup-btn {
            padding: 10px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="game-title">Crest of Glory</h1>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="login-tab" onclick="switchTab('login')">เข้าสู่ระบบ</button>
            <button type="button" class="tab-btn" id="register-tab" onclick="switchTab('register')">สมัครสมาชิก</button>
            <div class="tab-indicator" id="tab-indicator"></div>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn-text">เข้าสู่ระบบ</button>
        </form>
    </div>

    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text">ข้อความแจ้งเตือน</p>
            <button class="popup-btn" onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <!-- โหลด Supabase และควบคุมระบบผ่าน Module Script -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://diyqqdqitldcwkcrjjme.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XRBLBS50FT1HuIf1A50HCA_eLFwQFnW';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentMode = 'login';

        window.switchTab = function(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const submitBtnText = document.getElementById('submit-btn-text');
            const indicator = document.getElementById('tab-indicator');

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                submitBtnText.textContent = 'เข้าสู่ระบบ';
                indicator.style.transform = 'translateX(0%)';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtnText.textContent = 'สมัครสมาชิก';
                indicator.style.transform = 'translateX(100%)';
            }
        };

        window.showPopup = function(message, callback = null) {
            const modal = document.getElementById('popup-modal');
            const textEl = document.getElementById('popup-text');
            textEl.textContent = message;
            modal.style.display = 'flex';
            window.popupCallback = callback;
        };

        window.closePopup = function() {
            document.getElementById('popup-modal').style.display = 'none';
            if (window.popupCallback) {
                window.popupCallback();
                window.popupCallback = null;
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        });

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (password.length < 6) {
                window.showPopup('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษรขึ้นไป');
                return;
            }

            if (currentMode === 'register') {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    window.showPopup('สมัครสมาชิกไม่สำเร็จ: ' + error.message);
                } else {
                    if (email === 'adminzelisanya@gmail.com') {
                        await supabase
                            .from('profiles')
                            .update({ role: 'admin' })
                            .eq('id', data.user.id);
                    }
                    window.showPopup('สมัครสมาชิกสำเร็จ! ยินดีต้อนรับสู่ Crest of Glory', () => {
                        window.location.href = 'home.html';
                    });
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    window.showPopup('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                } else {
                    if (email === 'adminzelisanya@gmail.com') {
                        await supabase
                            .from('profiles')
                            .update({ role: 'admin' })
                            .eq('id', data.user.id);
                    }
                    window.location.href = 'home.html';
                }
            }
        };
    </script>
</body>
</html>
