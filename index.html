<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crest of Glory - เข้าสู่ระบบ / สมัครสมาชิก</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --btn-text: #0f0f0f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* ปลดล็อกให้เลื่อนหน้าจอและรีเฟรชได้ตามปกติ */
            overflow-y: auto; 
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .game-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .game-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            padding-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            z-index: 2;
        }

        .tab-btn.active {
            color: var(--text-primary);
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 2px;
            background-color: var(--accent-color);
            transition: transform 0.3s ease;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        #popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-message {
            font-size: 15px;
            margin-bottom: 20px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .popup-btn {
            padding: 8px 24px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="game-title">Crest of Glory</h1>
        <p class="game-subtitle">Forge Your Legacy</p>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="login-tab" onclick="switchTab('login')">เข้าสู่ระบบ</button>
            <button type="button" class="tab-btn" id="register-tab" onclick="switchTab('register')">สมัครสมาชิก</button>
            <div class="tab-indicator" id="tab-indicator"></div>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn-text">เข้าสู่ระบบ</button>
        </form>
    </div>

    <div id="popup-modal">
        <div class="popup-content">
            <p class="popup-message" id="popup-text">ข้อความแจ้งเตือน</p>
            <button class="popup-btn" onclick="closePopup()">ตกลง</button>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const submitBtnText = document.getElementById('submit-btn-text');
            const indicator = document.getElementById('tab-indicator');

            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                submitBtnText.textContent = 'เข้าสู่ระบบ';
                indicator.style.transform = 'translateX(0%)';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                submitBtnText.textContent = 'สมัครสมาชิก';
                indicator.style.transform = 'translateX(100%)';
            }
        }

        function showPopup(message, callback = null) {
            const modal = document.getElementById('popup-modal');
            const textEl = document.getElementById('popup-text');
            textEl.textContent = message;
            modal.style.display = 'flex';
            window.popupCallback = callback;
        }

        function closePopup() {
            document.getElementById('popup-modal').style.display = 'none';
            if (window.popupCallback) {
                window.popupCallback();
                window.popupCallback = null;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        });

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (currentMode === 'register') {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    showPopup('สมัครสมาชิกไม่สำเร็จ: ' + error.message);
                } else {
                    if (email === 'adminzelisanya@gmail.com') {
                        await supabase
                            .from('profiles')
                            .update({ role: 'admin' })
                            .eq('id', data.user.id);
                    }
                    showPopup('สมัครสมาชิกสำเร็จ! ยินดีต้อนรับสู่ Crest of Glory', () => {
                        window.location.href = 'home.html';
                    });
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showPopup('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                } else {
                    if (email === 'adminzelisanya@gmail.com') {
                        await supabase
                            .from('profiles')
                            .update({ role: 'admin' })
                            .eq('id', data.user.id);
                    }
                    window.location.href = 'home.html';
                }
            }
        }
    </script>
</body>
</html>
